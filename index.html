    ${sub === 'ideas' ? `${Object.entries(REWARD_CATS).map(([c, C]) => `<section><h3>${C.e} ${C.name}</h3><div class="stack">${REWARD_CATALOG.filter((r) => r.cat === c).map((r) => `<div class="panel ${C.tint}" style="flex-direction:row;align-items:center;gap:12px;padding:14px"><span class="avatar" style="background:var(--surface);font-size:22px">${r.emoji}</span><div style="flex:1;min-width:0"><b>${esc(r.title)}</b><p class="small muted">${fmt(r.points)} puntos · ${WHEN_TXT[r.when]}${r.perWeek ? ` · máx. ${r.perWeek}/semana` : ''}</p></div>${has.has(r.title) ? '<span class="chip mint">Añadido</span>' : `<button class="btn small primary" data-act="reward-add" data-kid="${kid}" data-c="${r.cid}">Añadir</button>`}</div>`).join('')}</div></section>`).join('')}`
    : sub === 'consejos' ? rewardTips()
    : `<section class="panel"><div class="list">${(st.rewards || []).map((r) => `<div class="spread"><span class="row" style="flex-wrap:nowrap"><span class="avatar small ${REWARD_CATS[r.cat || 'familia'].tint}" style="font-size:16px">${esc(r.emoji || '⭐')}</span><span><b>${esc(r.title)}</b><br><span class="small muted"><span class="pts">${fmt(r.points)}</span> · ${WHEN_TXT[r.when || 'any']}${r.perWeek ? ` · máx. ${r.perWeek}/semana` : ''}</span></span></span><button class="btn small ghost" data-act="remove-reward" data-kid="${kid}" data-id="${r.id}">Quitar</button></div>`).join('') || '<p class="small muted">Ninguno todavía. Mira «Ideas de premios».</p>'}</div>
      <form id="f-reward2" class="stack" novalidate><h3>Premio a medida</h3>
        <div class="field"><label for="rw2-title">Premio</label><input id="rw2-title" class="input" maxlength="50" placeholder="Ej.: elegir la música en el coche"></div>
        <div class="grid2"><div class="field"><label for="rw2-cat">Tipo</label><select id="rw2-cat" class="input">${Object.entries(REWARD_CATS).map(([k, C]) => `<option value="${k}">${C.e} ${C.name}</option>`).join('')}</select></div>
          <div class="field"><label for="rw2-pts">Puntos</label><select id="rw2-pts" class="input">${[100, 150, 200, 300, 400, 600, 900, 1200].map((v) => `<option value="${v}" ${v === 300 ? 'selected' : ''}>${v}</option>`).join('')}</select></div></div>
        <div class="grid2"><div class="field"><label for="rw2-when">Cuándo</label><select id="rw2-when" class="input"><option value="any">Cualquier día</option><option value="finde">Fin de semana</option></select></div>
          <div class="field"><label for="rw2-week">Límite</label><select id="rw2-week" class="input"><option value="">Sin límite</option><option value="1">1 a la semana</option><option value="2">2 a la semana</option></select></div></div>
        <p id="rw2-err" class="note danger" hidden></p><button class="btn primary block" type="submit">Añadir premio</button></form></section>`}
    <section class="panel tint-sun"><div class="spread"><h3>Dale ánimo</h3><span class="chip">Elogio o sorpresa</span></div>
      <p class="small">Los elogios refuerzan las ganas de estudiar por sí mismo; las sorpresas no se esperan y por eso no «compran» el esfuerzo.</p>
      <div class="row">${['¡Qué orgullo! 💪', '¡Sigue así, crack! 🔥', 'Se nota tu esfuerzo 👏', '¡Gran semana! 🌟'].map((t) => `<button class="btn small" data-act="kudos" data-kid="${kid}" data-t="${esc(t)}">${esc(t)}</button>`).join('')}</div>
      <div class="row"><button class="btn small sun" data-act="kudos" data-kid="${kid}" data-t="¡Sorpresa por tu constancia! 🎁" data-b="50">Sorpresa +50 puntos</button><button class="btn small sun" data-act="kudos" data-kid="${kid}" data-t="¡Sorpresa por tu constancia! 🎁" data-b="100">Sorpresa +100 puntos</button></div></section>
    <section class="panel"><h3>Reto de la semana</h3><p class="small muted">Un premio que se consigue con constancia, sin gastar puntos. Se comprueba solo.</p>
      ${(st.goals || []).map((g) => { const p = goalProgress(st, g); return `<div class="stack" style="gap:6px"><div class="spread"><b>${esc(g.emoji || '🏆')} ${esc(goalLabel(g))} → ${esc(g.title)}</b><button class="btn small ghost" data-act="goal-remove" data-kid="${kid}" data-id="${g.id}" aria-label="Quitar reto">✕</button></div><div class="bar indigo"><i style="width:${p.pct}%"></i></div><p class="small muted">${g.type === 'days' ? `${p.v} de ${g.target} días` : `${fmtDur(p.v)} de ${fmtDur(g.target)}`}${p.done ? ' · ¡conseguido!' : ''}</p></div>`; }).join('')}
      ${(st.goals || []).length < 2 ? `<form id="f-goal" class="stack" novalidate>
        <div class="grid2"><div class="field"><label for="gl-type">Meta</label><select id="gl-type" class="input">${[['days:3', '3 días con estudio'], ['days:4', '4 días con estudio'], ['days:5', '5 días con estudio'], ['minutes:180', '3 h en la semana'], ['minutes:300', '5 h en la semana'], ['minutes:480', '8 h en la semana']].map(([v, l]) => `<option value="${v}" ${v === 'days:4' ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
          <div class="field"><label for="gl-title">Premio</label><input id="gl-title" class="input" maxlength="50" placeholder="Elegir el plan del domingo"></div></div>
        <p id="gl-err" class="note danger" hidden></p><button class="btn primary block" type="submit">Crear reto</button></form>` : ''}</section>
    <section><h3>Historial</h3><div class="list">${(st.claims || []).filter((c) => c.status !== 'pending').sort((a, b) => b.at - a.at).slice(0, 10).map((c) => `<div class="spread small"><span>${esc(c.title)} · ${fmtWhen(c.at)}</span><span class="chip ${c.status === 'approved' ? 'mint' : 'danger'}">${c.status === 'approved' ? (c.goal ? 'Reto' : 'Aprobado') : 'No esta vez'}</span></div>`).join('') || '<p class="small muted">Nada todavía.</p>'}</div></section>`;
}
function rewardTips() {
  return `<section class="panel tint-mint"><h3>Premios que funcionan</h3><div class="ai-out small">
    <ul>
      <li><b>Premia el esfuerzo, no la nota.</b> Envés ya lo hace: los puntos salen del tiempo de estudio. Pagar por notas no suele funcionar; premiar lo que lleva a aprender, sí.</li>
      <li><b>Cumple pronto.</b> Un premio que llega tarde pierde casi todo su efecto.</li>
      <li><b>Mezcla premios con elogios.</b> Un «qué orgullo» sincero refuerza las ganas de estudiar por sí mismo; los premios solos pueden apagarlas si se vuelven lo único.</li>
      <li><b>Mejor experiencias y autonomía que cosas.</b> Planes juntos, elegir, un privilegio… dejan mejor recuerdo y no generan «tarifas».</li>
      <li><b>Pactadlos juntos.</b> Que pueda proponer premios le da control y compromiso.</li>
      <li><b>Sorpresas de vez en cuando.</b> Como no se esperan, no «compran» el esfuerzo.</li>
      <li><b>Lo básico no se negocia.</b> No uses como premio la comida, el descanso ni cosas que ya le corresponden, y no quites puntos como castigo.</li>
      <li><b>El objetivo es que no haga falta.</b> Los premios ayudan a arrancar; con el tiempo, lo que queda es el hábito.</li>
    </ul></div><p class="small muted">Basado en estudios sobre incentivos en educación (Fryer, 2011; Levitt y otros, 2016) y motivación (Deci, Koestner y Ryan, 1999). Pendiente de revisión por Psicología.</p></section>`;
}

/* ---------------------------------------------------------------- Acciones */
Object.assign(ACT, {
  'claim-reward'(b) {
    if (!need('child')) return; const st = ST(), r = (st.rewards || []).find((x) => x.id === b.dataset.id), w = wallet();
    if (!r || rewardBlock(st, r, w)) return;
    st.claims = st.claims || []; st.claims.push({ id: uid(), rewardId: r.id, title: r.title, points: r.points, at: now(), status: 'pending' });
    notifyGuardians(`${st.user.name} ha pedido un premio: ${r.title} (${r.points} puntos).`, 'claim'); render(); toast('Pedido. Tus padres lo verán al momento.');
  },
  'rw-tab'(b) { ui.rwTab = b.dataset.t; render(); },
  'reward-add'(b) {
    if (!need('parent') || !myKids().includes(b.dataset.kid)) return; const c = REWARD_CATALOG.find((x) => x.cid === b.dataset.c); if (!c) return;
    const st = S.students[b.dataset.kid]; st.rewards = st.rewards || []; st.rewards.push({ id: uid(), title: c.title, points: c.points, cat: c.cat, emoji: c.emoji, when: c.when, perWeek: c.perWeek }); save(); render(); toast(`Añadido: ${c.title}`);
  },
  kudos(b) {
    if (!need('parent') || !myKids().includes(b.dataset.kid)) return; const st = S.students[b.dataset.kid], bonus = Number(b.dataset.b || 0), t = now();
    st.kudos = st.kudos || []; st.kudos.push({ id: uid(), from: SESSION.accountId, text: b.dataset.t, bonus: bonus || null, at: t, seen: false });
    if (bonus) st.ledger.push({ id: uid(), type: 'earn', kind: 'bonus', pts: bonus, at: t, day: dayKey(t), vestAt: t, note: 'Sorpresa de tus padres' });
    save(); toast(bonus ? `Sorpresa enviada: +${bonus} puntos.` : 'Ánimo enviado. Le llegará al momento.'); celebrate();
  },
  'goal-remove'(b) { if (!need('parent') || !myKids().includes(b.dataset.kid)) return; const st = S.students[b.dataset.kid]; st.goals = (st.goals || []).filter((g) => g.id !== b.dataset.id); save(); render(); },
  'proposal-no'(b) { if (!need('parent') || !myKids().includes(b.dataset.kid)) return; const x = (S.students[b.dataset.kid].proposals || []).find((p) => p.id === b.dataset.id); if (x) { x.status = 'rejected'; save(); render(); } },
});
document.addEventListener('submit', (e) => {
  const f = e.target; const showErr = (id, msg) => { const el = $(id); el.textContent = msg; el.hidden = false; };
  if (f.id === 'f-propose') {
    if (!need('child')) return; const title = $('#pr-title').value.trim(); if (title.length < 3) return showErr('#pr-err', 'Escribe tu idea.');
    const st = ST(); st.proposals = st.proposals || []; st.proposals.push({ id: uid(), title, at: now(), status: 'pending' });
    notifyGuardians(`${st.user.name} propone un premio: «${title}».`, 'claim'); render(); toast('Propuesta enviada a tus padres.');
  }
  if (f.dataset.form === 'proposal') {
    if (!need('parent') || !myKids().includes(f.dataset.kid)) return; const st = S.students[f.dataset.kid], x = (st.proposals || []).find((p) => p.id === f.dataset.id); if (!x) return;
    x.status = 'accepted'; st.rewards = st.rewards || []; st.rewards.push({ id: uid(), title: x.title, points: Number(f.querySelector('select').value), cat: 'experiencias', emoji: '💡', when: 'any' }); save(); render(); toast('Premio añadido a su lista.');
  }
  if (f.id === 'f-goal') {
    if (!need('parent')) return; const [type, target] = $('#gl-type').value.split(':'), title = $('#gl-title').value.trim();
    if (title.length < 3) return showErr('#gl-err', 'Escribe el premio del reto.');
    const st = S.students[ui.kid]; st.goals = st.goals || []; st.goals.push({ id: uid(), type, target: Number(target), title, emoji: '🏆' }); save(); render(); toast('Reto creado. Se comprueba solo cada semana.');
  }
  if (f.id === 'f-reward2') {
    if (!need('parent')) return; const title = $('#rw2-title').value.trim(); if (title.length < 3) return showErr('#rw2-err', 'Escribe el premio.');
    const cat = $('#rw2-cat').value, st = S.students[ui.kid]; st.rewards = st.rewards || [];
    st.rewards.push({ id: uid(), title, points: Number($('#rw2-pts').value), cat, emoji: REWARD_CATS[cat].e, when: $('#rw2-when').value, perWeek: Number($('#rw2-week').value) || null }); save(); render(); toast('Premio añadido.');
  }
});

/* ================================================================ v6 · DENUNCIAS Y QUEJAS (las supervisa la administración)
   Cualquier cuenta puede denunciar o reclamar. La administración revisa y, si una parte lo ha hecho mal,
   puede avisar, limitar o bloquear temporalmente esa cuenta, siempre con un motivo. */
const C_KINDS = { usuario: 'Sobre otro usuario', local: 'Sobre un local', estudiante: 'Sobre un estudiante', app: 'Sobre la app, los puntos o los cobros', post: 'Publicación denunciada' };
const C_REASONS = { usuario: ['Acoso o insultos', 'Foto mía o de otra persona sin permiso', 'Contenido inapropiado', 'Posible menor de edad', 'Otro'],
  local: ['Rechazó un canje sin motivo', 'La promoción no se cumplió', 'Mal trato', 'Otro'], estudiante: ['Intento de trampa en un canje', 'Comportamiento inadecuado', 'Otro'],
  app: ['Puntos que no llegan', 'Error de la app', 'Cobro o suscripción', 'Otro'] };
const URGENT = ['Acoso o insultos', 'Foto mía o de otra persona sin permiso', 'Posible menor de edad'];
const sanctionOf = (id) => { const s = (S.sanctions || {})[id]; return s && s.until > now() ? s : null; };
function kindsFor(t) { return t === 'student' ? ['usuario', 'local', 'app'] : t === 'owner' || t === 'staff' ? ['estudiante', 'app'] : ['app']; }
function targetsFor(kind) {
  const me = SESSION.accountId;
  if (kind === 'usuario') return Object.values(S.accounts).filter((a) => a.type === 'student' && a.id !== me && a.alias).map((a) => [a.id, '@' + a.alias]);
  if (kind === 'local') return Object.values(S.merchants).filter((m) => m.status === 'active').map((m) => [m.ownerId, m.name]);
  if (kind === 'estudiante') { const m = MER(); const al = [...new Set(S.redemptions.filter((r) => r.merchantId === m?.id).map((r) => r.alias))]; return al.map((x) => [Object.values(S.accounts).find((a) => a.alias === x)?.id || '', '@' + x]).filter(([i]) => i); }
  return [];
}
SHEETS.complaint = (s) => {
  const t = ACC()?.type, kinds = kindsFor(t), kind = s.kind || kinds[0], tg = targetsFor(kind);
  return `<p class="eyebrow">Denuncias y quejas</p><h2>Cuéntanos qué ha pasado</h2>
    <p class="small muted">Lo revisa el equipo de Envés, normalmente en 48 h (24 h si hay acoso, fotos sin permiso o un posible menor). Te diremos qué hemos decidido.</p>
    <form id="f-complaint" class="stack" novalidate>
      <div class="field"><label for="cp-kind">Tipo</label><select id="cp-kind" class="input" data-change="cp-kind">${kinds.map((k) => `<option value="${k}" ${k === kind ? 'selected' : ''}>${C_KINDS[k]}</option>`).join('')}</select></div>
      ${tg.length ? `<div class="field"><label for="cp-target">¿Sobre quién?</label><select id="cp-target" class="input">${tg.map(([v, l]) => `<option value="${v}" ${s.target === v ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></div>` : ''}
      <div class="field"><label for="cp-reason">Motivo</label><select id="cp-reason" class="input">${C_REASONS[kind].map((r) => `<option>${r}</option>`).join('')}</select></div>
      <div class="field"><label for="cp-text">Explícalo</label><textarea id="cp-text" class="input" maxlength="800" placeholder="Qué pasó, cuándo y dónde"></textarea></div>
      <p id="cp-err" class="note danger" hidden></p>
      <button class="btn primary block" type="submit">Enviar</button><button class="btn block" type="button" data-act="close-sheet">Cancelar</button>
    </form><p class="small muted">También puedes escribir a moderacion@enves.app. Las denuncias falsas pueden tener consecuencias.</p>`;
};
CLOSABLE.add('complaint');
function myComplaints() {
  const mine = (S.complaints || []).filter((c) => c.by === SESSION.accountId).slice(-5).reverse();
  const sn = sanctionOf(SESSION.accountId);
  return `${sn ? `<div class="note danger"><b>Tu cuenta está ${sn.type === 'block' ? 'bloqueada' : 'limitada'} hasta el ${fmtWhen(sn.until)}.</b> Motivo: ${esc(sn.reason)}. Si no estás de acuerdo, escribe a moderacion@enves.app.</div>` : ''}
    <section class="panel"><div class="spread"><h3>Denuncias y quejas</h3><button class="btn small" data-act="complaint-open">Nueva</button></div>
    ${mine.length ? `<div class="list small">${mine.map((c) => `<div><div class="spread"><b>${esc(c.reason)}</b><span class="chip ${c.status === 'open' ? 'sun' : 'mint'}">${c.status === 'open' ? 'En revisión' : 'Resuelta'}</span></div>${c.decision ? `<p class="muted">Respuesta: ${esc(c.decision)}</p>` : ''}</div>`).join('')}</div>` : '<p class="small muted">Si alguien te molesta, un local no cumple o algo falla, cuéntanoslo.</p>'}</section>`;
}
// En «Privacidad y ayuda» de todos los perfiles
const _helpSection = helpSection;
helpSection = function (type) { return _helpSection(type) + myComplaints(); };

function adminComplaints() {
  const all = [...(S.complaints || [])].sort((a, b) => (a.status === 'open') - (b.status === 'open') || b.at - a.at).reverse();
  const open = all.filter((c) => c.status === 'open'), done = all.filter((c) => c.status !== 'open').slice(0, 8);
  const sanc = Object.entries(S.sanctions || {}).filter(([, s]) => s.until > now());
  const who = (id) => { const a = S.accounts[id]; if (!a) return '—'; return a.alias ? '@' + a.alias : a.merchantId ? S.merchants[a.merchantId]?.name : a.name || TYPE_LABEL[a.type]; };
  const card = (c) => { const urgent = URGENT.includes(c.reason), due = c.at + (urgent ? 24 : 48) * H, late = due < now(); const p = c.postId && S.posts.find((x) => x.id === c.postId);
    const prior = (S.complaints || []).filter((x) => x.target && x.target === c.target).length;
    return `<article class="panel"><div class="spread"><span class="small muted">${C_KINDS[c.kind]} · ${fmtWhen(c.at)}</span><span class="chip ${late ? 'danger' : urgent ? 'sun' : ''}">${late ? 'Fuera de plazo' : `Plazo: ${fmtWhen(due)}`}</span></div>
      <h3>${esc(c.reason)}</h3><div class="list small"><div class="kv"><span>Denuncia</span><span>${esc(who(c.by))}</span></div>${c.target ? `<div class="kv"><span>Denunciado</span><span>${esc(who(c.target))} · ${prior} queja${prior === 1 ? '' : 's'} en total</span></div>` : ''}</div>
      ${c.text ? `<p class="note small">${esc(c.text)}</p>` : ''}${p ? postHtml(p, '') : ''}
      <div class="field"><label for="dc-${c.id}">Decisión y motivo (se lo enviamos a las dos partes)</label><input id="dc-${c.id}" class="input" placeholder="Ej.: comprobado en el registro de canjes"></div>
      <div class="row">${c.target ? `<button class="btn small" data-act="c-decide" data-id="${c.id}" data-s="warn">Aviso</button><button class="btn small sun" data-act="c-decide" data-id="${c.id}" data-s="limit">Limitar 7 días</button><button class="btn small danger" data-act="c-decide" data-id="${c.id}" data-s="block7">Bloquear 7 días</button><button class="btn small danger" data-act="c-decide" data-id="${c.id}" data-s="block30">Bloquear 30 días</button>` : ''}
        ${p ? `<button class="btn small danger" data-act="c-decide" data-id="${c.id}" data-s="remove">Retirar publicación</button>` : ''}<button class="btn small primary" data-act="c-decide" data-id="${c.id}" data-s="none">Resolver sin sanción</button></div></article>`; };
  return `<section class="stack"><p class="small muted">Plazo: 48 h, o 24 h si hay acoso, fotos sin permiso o un posible menor. Cada decisión lleva un motivo que se envía a las dos partes. «Limitar»: sin publicar, comentar ni canjear (si es un local, sus promociones dejan de verse). «Bloquear»: no puede entrar.</p>
    ${open.map(card).join('') || '<div class="panel"><b>No hay denuncias ni quejas pendientes.</b></div>'}
    ${sanc.length ? `<section class="panel"><h3>Sanciones activas</h3><div class="list small">${sanc.map(([id, s]) => `<div class="spread"><span><b>${esc(who(id))}</b> · ${s.type === 'block' ? 'bloqueo' : 'limitación'} hasta ${fmtWhen(s.until)}<br><span class="muted">${esc(s.reason)}</span></span><button class="btn small ghost" data-act="c-lift" data-id="${id}">Levantar</button></div>`).join('')}</div></section>` : ''}
    ${done.length ? `<section><h3>Resueltas</h3><div class="list small">${done.map((c) => `<div class="spread"><span>${esc(c.reason)} · ${esc(c.decision || '')}</span><span class="chip">${esc(c.outcome || '')}</span></div>`).join('')}</div></section>` : ''}</section>`;
}

/* ---------------------------------------------------------------- Invitaciones: 150 a quien invita cuando el invitado hace su 1.ª sesión de 25 min */
function referralOnSession(st, focus, t) {
  if (!st.invitedBy || st.inviterPaid || focus < 25 || !st.inviteDone) return;
  const acc = S.accounts[SESSION.accountId]; if (!acc || t - acc.createdAt > 14 * D) return;
  st.inviterPaid = true; const inv = S.students[st.invitedBy]; if (!inv) return;
  const mk = new Date(t).toISOString().slice(0, 7);
  const n = inv.ledger.filter((e) => e.kind === 'referral' && e.pts === CFG.referral.points && new Date(e.at).toISOString().slice(0, 7) === mk).length;
  inv.invites.completed++; inv.invites.inProgress = Math.max(0, inv.invites.inProgress - 1);
  if (n < CFG.referral.maxPerMonth) inv.ledger.push({ id: uid(), type: 'earn', kind: 'referral', pts: CFG.referral.points, at: t, day: dayKey(t), vestAt: t + CFG.vestingHours * H, note: `Invitación completada: ${st.user.alias}` });
}

/* ---------------------------------------------------------------- Calendario semanal y mensual (color según horas de estudio) */
const heatLevel = (m) => (m <= 0 ? 0 : m < 30 ? 1 : m < 60 ? 2 : m < 120 ? 3 : 4);
const HEAT = ['var(--surface-3)', '#DDF5EA', '#9FE0C4', '#4FC08D', '#1B8A5A'];
function minutesByDay(log) { const m = {}; for (const e of log || []) { const k = dayKey(e.end || e.at); m[k] = (m[k] || 0) + (e.focus || 0); } return m; }
function studyCalendar(log) {
  const mins = minutesByDay(log), t = new Date(now()), y = t.getFullYear(), mo = t.getMonth();
  const first = new Date(y, mo, 1), startDow = (first.getDay() + 6) % 7, days = new Date(y, mo + 1, 0).getDate();
  const cells = []; for (let i = 0; i < startDow; i++) cells.push('<i></i>');
  let total = 0, studied = 0;
  for (let d = 1; d <= days; d++) {
    const k = `${y}-${pad2(mo + 1)}-${pad2(d)}`, m = mins[k] || 0; total += m; if (m) studied++;
    const isT = d === t.getDate();
    cells.push(`<span title="${d}: ${m} min" style="background:${HEAT[heatLevel(m)]};${heatLevel(m) >= 3 ? 'color:#fff;' : ''}${isT ? 'outline:2px solid var(--ink);' : ''}">${d}</span>`);
  }
  const month = first.toLocaleDateString('es-ES', { month: 'long', year: 'numeric' });
  return `<div class="spread"><b style="text-transform:capitalize">${month}</b><span class="small muted">${studied} días · ${fmtDur(total)}</span></div>
    <div class="cal">${DAYS.map((d) => `<em>${d}</em>`).join('')}${cells.join('')}</div>
    <div class="row small muted" style="gap:6px">${['0', '<30′', '30–60′', '1–2 h', '+2 h'].map((l, i) => `<span class="row" style="gap:4px"><i style="width:12px;height:12px;border-radius:4px;background:${HEAT[i]};display:inline-block"></i>${l}</span>`).join('')}</div>`;
}

  ['crecer', '🧑‍🍳', 'Hacer una receta juntos', 120, 1, 'w1', 1, 0, 'p'], ['crecer', '🎨', 'Taller o actividad que le guste', 500, 1, 'm1', 0, 0, 'p'],
].map(([cat, emoji, title, points, n, per, we, buy, st], i) => ({ cid: 'k' + i, cat, emoji, title, points, n, unit: per[0], every: Number(per.slice(1)), we: !!we, buy: !!buy, stages: st.split(' ') }));
const freqText = (r) => `${r.n === 1 ? '1 vez' : `${r.n} veces`} ${r.unit === 'w' ? (r.every === 1 ? 'a la semana' : `cada ${r.every} semanas`) : r.every === 1 ? 'al mes' : `cada ${r.every} meses`}${r.we ? ' · solo fin de semana' : ''}`;
const windowMs = (r) => (r.unit === 'w' ? 7 * D * r.every : 30 * D * r.every);
function rewardBlock(st, r, w) {
  if ((st.rewards || []).length < 3) return 'Tus padres aún están eligiendo premios';
  if (w.available < r.points) return `Te faltan ${fmt(r.points - w.available)} puntos`;
  const t = now(), mine = (st.claims || []).filter((c) => c.status !== 'rejected');
  if (r.n && mine.filter((c) => c.rewardId === r.id && t - c.at < windowMs(r)).length >= r.n) return `Ya lo has usado ${freqText({ ...r, we: false })}`;
  if (r.buy && mine.some((c) => c.buy && t - c.at < 30 * D)) return 'Ya has pedido una compra este mes';
  if (r.we && !isWeekend()) return 'Se puede pedir de viernes a domingo';
  return null;
}
function childRewards() {
  const st = ST(), w = wallet(); goalsCheck(SESSION.accountId);
  const claims = [...(st.claims || [])].sort((a, b) => b.at - a.at), rw = st.rewards || [];
  const groups = Object.keys(CATS2).map((c) => [c, rw.filter((r) => (r.cat || 'familia') === c)]).filter(([, l]) => l.length);
  return `<div class="hero peach"><p class="eyebrow">Premios de tus padres</p><h1>${fmt(w.available)} puntos</h1>
      <p class="small">${w.held ? `${fmt(w.held)} reservados en premios pendientes · ` : ''}1 hora de estudio ≈ 60–70 puntos.</p>
      <button class="btn primary small" data-act="sheet" data-sheet="points-guide">¿Cuántos puntos se ganan?</button></div>
    ${kidMessages(st)}
    ${(st.goals || []).map((g) => { const p = goalProgress(st, g); return `<section class="panel ${p.done ? 'tint-mint' : 'tint-lav'}"><div class="spread"><span class="eyebrow">Reto de la semana</span>${p.done ? '<span class="chip mint">¡Conseguido!</span>' : ''}</div><b>${esc(goalLabel(g))} → ${esc(g.title)}</b><div class="bar indigo"><i style="width:${p.pct}%"></i></div></section>`; }).join('')}
    ${rw.length < 3 ? '<div class="note">Tus padres todavía están eligiendo tus premios (mínimo 3).</div>' : ''}
    ${groups.map(([c, list]) => `<section><h3>${CATS2[c][0]} ${CATS2[c][1]}</h3><div class="stack">${list.map((r) => { const b = rewardBlock(st, r, w); return `<article class="promo" style="flex-direction:row;align-items:center;gap:12px">
      <span class="avatar big ${CATS2[c][2]}" style="font-size:28px">${esc(r.emoji || '⭐')}</span>
      <div style="flex:1;min-width:0"><b>${esc(r.title)}</b><p class="small muted">${r.n ? freqText(r) : 'Premio personalizado'}</p><span class="pts small">${fmt(r.points)} puntos</span>${b ? `<p class="small muted">${esc(b)}</p>` : ''}</div>
      <button class="btn small ${b ? '' : 'reward'}" data-act="claim-reward" data-id="${r.id}" ${b ? 'disabled' : ''}>Pedir</button></article>`; }).join('')}</div></section>`).join('')}
    <section class="panel"><h3>¿Se te ocurre otro premio?</h3><p class="small muted">Propónselo a tus padres.</p>
      <form id="f-propose" class="row" novalidate style="flex-wrap:nowrap"><input id="pr-title" class="input" maxlength="50" placeholder="Ej.: ir a un concierto"><button class="btn primary small" type="submit">Proponer</button></form><p id="pr-err" class="note danger" hidden></p></section>
    <section><h3>Lo que has pedido</h3><div class="list">${claims.slice(0, 10).map((c) => `<div class="spread small"><span>${esc(c.title)} · ${fmtWhen(c.at)}</span><span class="chip ${c.status === 'approved' ? 'mint' : c.status === 'pending' ? 'sun' : 'danger'}">${{ approved: '¡Disfrútalo!', pending: 'Pendiente', rejected: 'No esta vez' }[c.status]}</span></div>`).join('') || '<p class="small muted">Nada todavía.</p>'}</div></section>`;
}
function parentRewards(kid) {
  const st = S.students[kid], plus = isPlus(), stage = stageOf(st), sel = st.rewards || [], sub = ui.rwTab || 'catalogo';
  const byCid = Object.fromEntries(sel.filter((r) => r.cid).map((r) => [r.cid, r]));
  const pend = (st.claims || []).filter((c) => c.status === 'pending'), props = (st.proposals || []).filter((x) => x.status === 'pending');
  const adj = (r) => { const base = CATALOG2.find((c) => c.cid === r.cid); if (!base) return '';
    const pts = [0.5, 0.75, 1, 1.25, 1.5].map((f) => Math.round((base.points * f) / 10) * 10);
    return `<div class="row" style="gap:6px"><select class="input" style="min-height:40px;width:auto" data-change="rw-pts" data-kid="${kid}" data-id="${r.id}" aria-label="Puntos">${pts.map((p) => `<option value="${p}" ${p === r.points ? 'selected' : ''}>${p} puntos</option>`).join('')}</select>
      <select class="input" style="min-height:40px;width:auto" data-change="rw-freq" data-kid="${kid}" data-id="${r.id}" aria-label="Frecuencia">${[1, 2, 4].map((f) => `<option value="${f}" ${r.every === base.every * f ? 'selected' : ''}>${freqText({ ...base, every: base.every * f, we: false })}</option>`).join('')}</select></div>`; };
  return `<div class="hero peach"><p class="eyebrow">Premios de ${esc(st.user.name)} · ${STAGES[stage]}</p><h1>Premia el esfuerzo, no la nota.</h1>
      <p class="small">Elige al menos 3 premios del catálogo de Envés (puedes elegirlos todos). Puedes ajustar los puntos hasta un 50 % y hacerlos menos frecuentes.</p>
      <button class="btn primary small" data-act="sheet" data-sheet="points-guide">¿Cuántos puntos se ganan por hora?</button></div>
    ${pend.length ? `<section><h2>Te lo ha pedido</h2>${pend.map((c) => `<article class="redemption new"><h3>${esc(c.title)}</h3><p class="small">${fmt(c.points)} puntos · ${fmtWhen(c.at)}</p><div class="grid2"><button class="btn primary" data-act="approve-claim" data-kid="${kid}" data-id="${c.id}">Aprobar</button><button class="btn" data-act="reject-claim" data-kid="${kid}" data-id="${c.id}">Ahora no</button></div></article>`).join('')}</section>` : ''}
    ${props.map((x) => `<section class="panel tint-lav"><b>${esc(st.user.name)} propone: «${esc(x.title)}»</b>${plus ? `<form class="row" data-form="proposal" data-kid="${kid}" data-id="${x.id}" novalidate><select class="input" style="flex:1;min-width:150px" aria-label="Puntos">${[150, 300, 500, 800, 1200, 2000].map((v) => `<option value="${v}">${v} puntos</option>`).join('')}</select><button class="btn primary small" type="submit">Añadir</button><button class="btn small ghost" type="button" data-act="proposal-no" data-kid="${kid}" data-id="${x.id}">No</button></form>` : '<p class="small muted">Añadir premios propuestos es de Familia Plus.</p>'}</section>`).join('')}
    <div class="note ${sel.length < 3 ? 'sun' : 'mint'}"><b>${sel.length} premios elegidos.</b> ${sel.length < 3 ? `Elige ${3 - sel.length} más para que ${esc(st.user.name)} pueda pedirlos.` : 'Listo.'}</div>
    <div class="tabs" role="group" aria-label="Premios"><button data-act="rw-tab" data-t="catalogo" aria-pressed="${sub === 'catalogo'}">Catálogo Envés</button><button data-act="rw-tab" data-t="mios" aria-pressed="${sub === 'mios'}">Elegidos (${sel.length})</button><button data-act="rw-tab" data-t="propios" aria-pressed="${sub === 'propios'}">Personalizados${plus ? '' : ' · Plus'}</button><button data-act="rw-tab" data-t="retos" aria-pressed="${sub === 'retos'}">Retos${plus ? '' : ' · Plus'}</button><button data-act="rw-tab" data-t="consejos" aria-pressed="${sub === 'consejos'}">Consejos</button></div>
    ${sub === 'catalogo' ? Object.entries(CATS2).map(([c, C]) => { const items = CATALOG2.filter((r) => r.cat === c && r.stages.includes(stage)); if (!items.length) return ''; return `<section><h3>${C[0]} ${C[1]}</h3><div class="stack">${items.map((r) => { const on = byCid[r.cid];
        return `<div class="panel ${C[2]}" style="padding:14px;gap:8px"><div class="row" style="flex-wrap:nowrap"><span class="avatar" style="background:var(--surface);font-size:22px">${r.emoji}</span><div style="flex:1;min-width:0"><b>${esc(r.title)}</b><p class="small muted">${fmt(r.points)} puntos · ${freqText(r)}</p></div>
        <button class="btn small ${on ? '' : 'primary'}" data-act="cat-toggle" data-kid="${kid}" data-c="${r.cid}">${on ? 'Quitar' : 'Elegir'}</button></div>${on ? adj(on) : ''}</div>`; }).join('')}</div></section>`; }).join('')
    : sub === 'mios' ? `<section class="panel"><div class="list">${sel.map((r) => `<div class="stack" style="gap:6px"><div class="spread"><span><b>${esc(r.emoji || '⭐')} ${esc(r.title)}</b><br><span class="small muted"><span class="pts">${fmt(r.points)}</span> · ${r.n ? freqText(r) : 'personalizado'}</span></span><button class="btn small ghost" data-act="remove-reward" data-kid="${kid}" data-id="${r.id}">Quitar</button></div>${r.cid ? adj(r) : ''}</div>`).join('') || '<p class="small muted">Ninguno todavía.</p>'}</div></section>`
    : sub === 'propios' ? (plus ? `<section class="panel"><form id="f-reward2" class="stack" novalidate><h3>Premio personalizado</h3>
        <div class="field"><label for="rw2-title">Premio</label><input id="rw2-title" class="input" maxlength="50" placeholder="Ej.: ir a ver a sus primos"></div>
        <div class="grid2"><div class="field"><label for="rw2-pts">Puntos</label><select id="rw2-pts" class="input">${[100, 150, 200, 300, 500, 800, 1200, 2000].map((v) => `<option value="${v}" ${v === 300 ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
        <div class="field"><label for="rw2-week">Límite</label><select id="rw2-week" class="input"><option value="1:w1">1 a la semana</option><option value="1:w2">1 cada 2 semanas</option><option value="1:m1">1 al mes</option></select></div></div>
        <p class="small muted">Nunca dinero ni importes en euros.</p><p id="rw2-err" class="note danger" hidden></p><button class="btn primary block" type="submit">Añadir premio</button></form></section>` : plusLock('Premios personalizados'))
    : sub === 'retos' ? (plus ? goalsSection(kid) : plusLock('Retos de la semana'))
    : rewardTips()}`;
}
function goalsSection(kid) {
  const st = S.students[kid];
  return `<section class="panel"><h3>Reto de la semana</h3><p class="small muted">Un premio que se consigue con constancia, sin gastar puntos.</p>
    ${(st.goals || []).map((g) => { const p = goalProgress(st, g); return `<div class="stack" style="gap:6px"><div class="spread"><b>${esc(goalLabel(g))} → ${esc(g.title)}</b><button class="btn small ghost" data-act="goal-remove" data-kid="${kid}" data-id="${g.id}" aria-label="Quitar reto">✕</button></div><div class="bar indigo"><i style="width:${p.pct}%"></i></div></div>`; }).join('')}
    ${(st.goals || []).length < 2 ? `<form id="f-goal" class="stack" novalidate><div class="grid2"><div class="field"><label for="gl-type">Meta</label><select id="gl-type" class="input">${[['days:3', '3 días con estudio'], ['days:4', '4 días'], ['days:5', '5 días'], ['minutes:180', '3 h en la semana'], ['minutes:300', '5 h'], ['minutes:480', '8 h']].map(([v, l]) => `<option value="${v}">${l}</option>`).join('')}</select></div>
      <div class="field"><label for="gl-title">Premio</label><input id="gl-title" class="input" maxlength="50" placeholder="Elegir el plan del domingo"></div></div><p id="gl-err" class="note danger" hidden></p><button class="btn primary block" type="submit">Crear reto</button></form>` : ''}</section>`;
}
Object.assign(ACT, {
  'cat-toggle'(b) {
    if (!need('parent') || !myKids().includes(b.dataset.kid)) return; const st = S.students[b.dataset.kid]; st.rewards = st.rewards || [];
    const ex = st.rewards.find((r) => r.cid === b.dataset.c);
    if (ex) { if (st.rewards.length <= 3) return toast('Tiene que haber al menos 3 premios. Elige otro antes de quitar este.'); st.rewards = st.rewards.filter((r) => r !== ex); }
    else { const c = CATALOG2.find((x) => x.cid === b.dataset.c); st.rewards.push({ id: uid(), cid: c.cid, title: c.title, emoji: c.emoji, cat: c.cat, points: c.points, n: c.n, unit: c.unit, every: c.every, we: c.we, buy: c.buy }); }
    save(); render();
  },
  'remove-reward'(b) { if (!need('parent') || !myKids().includes(b.dataset.kid)) return; const st = S.students[b.dataset.kid]; if (st.rewards.length <= 3) return toast('Tiene que haber al menos 3 premios.'); st.rewards = st.rewards.filter((r) => r.id !== b.dataset.id); save(); render(); },
  'claim-reward'(b) {
    if (!need('child')) return; const st = ST(), r = (st.rewards || []).find((x) => x.id === b.dataset.id), w = wallet();
    if (!r || rewardBlock(st, r, w)) return;
    st.claims = st.claims || []; st.claims.push({ id: uid(), rewardId: r.id, title: r.title, points: r.points, buy: !!r.buy, at: now(), status: 'pending' });
    notifyGuardians(`${st.user.name} ha pedido un premio: ${r.title} (${r.points} puntos).`, 'claim'); render(); toast('Pedido. Tus padres lo verán al momento.');
  },
});
document.addEventListener('change', (e) => {
  const el = e.target, k = el.dataset?.change; if (k !== 'rw-pts' && k !== 'rw-freq') return;
  if (!need('parent') || !myKids().includes(el.dataset.kid)) return;
  const r = (S.students[el.dataset.kid].rewards || []).find((x) => x.id === el.dataset.id), base = CATALOG2.find((c) => c.cid === r?.cid); if (!r || !base) return;
  if (k === 'rw-pts') r.points = Number(el.value); else r.every = base.every * Number(el.value);
  save(); toast('Guardado.');
});
document.addEventListener('submit', (e) => {
  if (e.target.id !== "f-reward2") return; e.preventDefault(); e.stopImmediatePropagation();
  if (!need('parent') || !isPlus()) return; const title = $('#rw2-title').value.trim(); if (title.length < 3) { const x = $('#rw2-err'); x.textContent = 'Escribe el premio.'; x.hidden = false; return; }
  const [n, per] = $('#rw2-week').value.split(':'), st = S.students[ui.kid]; st.rewards = st.rewards || [];
  st.rewards.push({ id: uid(), title, emoji: '⭐', cat: 'experiencias', points: Number($('#rw2-pts').value), n: Number(n), unit: per[0], every: Number(per.slice(1)), custom: true }); save(); render(); toast('Premio añadido.');
}, true);


/* ================================================================ BUCLE */
let lastSecond = 0;
function loop() {
  if (sess) { tickSession(); updateSessionDom(); }
  if (SESSION.counter) tickCounter();
  const sec = Math.floor(Date.now() / 1000);
  if (sec !== lastSecond) {
    lastSecond = sec;
    const changed = expireRedemptions();
    const a = ACC();
    if (a?.type === 'student' && ui.redeem?.step === 'pending') {
      const r = S.redemptions.find((x) => x.id === ui.redeem.rid);
      if (r && r.status !== 'pending') render();
      else { const c = $('#live-clock'); if (c) c.textContent = fmtTime(now()); const ttl = $('#rd-ttl'); if (ttl && r) ttl.textContent = `Caduca en ${fmtClock((r.expiresAt - now()) / MIN)} si nadie lo confirma.`; }
    }
    if (sec % 2 === 0) liveTick(a, changed);
    if ((a?.type === 'owner' || a?.type === 'staff') && !SESSION.counter && ui.localTab === 'ahora' && MER()?.status === 'active') {
      const sig = pendingSig(); const typing = document.activeElement && document.activeElement.closest?.('[data-form="confirm"]');
      if ((sig !== ui.ahoraSig || changed) && !typing) render();
    }
  }
}

/* Otra pestaña del mismo navegador cambia los datos (p. ej., estudiante en una y camarero en otra) */
window.addEventListener('storage', (e) => {
  if (e.key !== KEY || !e.newValue) return;
  try {
    S = JSON.parse(e.newValue);
    if (sess) return;
    const typing = document.activeElement && ['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName);
    if (!typing && !ui.ai?.busy) render();
  } catch { /* ignora */ }
});

/* ================================================================ ARRANQUE */
function boot() {
  S = store.load();
  if (!S || S.v !== 6) { S = seed(); save(); }
  ageCheck();
  aiInit();
  const h = (location.hash || '').slice(1); for (const part of h.split('&')) { if (/^inv-[A-Za-z0-9-]+$/.test(part)) ui.inviteCode = part.slice(4).toUpperCase(); if (/^g-[A-Za-z0-9-]+$/.test(part)) ui.groupCode = part.slice(2).toUpperCase(); }
  const ses = sessionStore.load();
  if (ses && ses.accountId && S.accounts[ses.accountId]) { SESSION = { accountId: ses.accountId, counter: !!ses.counter }; if (S.accounts[ses.accountId].type === 'parent') ui.tab = 'resumen'; }
  render(); renderLayer();
  setInterval(loop, 250);
  $('#dark').addEventListener('click', () => { setDark(false); if (sess && sess.phase === 'focus') sess.pickups++; });
}
boot();
})();

</script>
