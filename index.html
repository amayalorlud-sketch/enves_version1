<style>
/* Envés v4 · «Pastel con energía» (15/11/2026). Inspiración de la fundadora: fondos claros lavanda,
   tarjetas grandes muy redondeadas, colores pastel (lavanda, mantequilla, melocotón, menta), círculos
   decorativos, botones oscuros en píldora y barra inferior flotante. Celebraciones al ganar puntos.
   Índigo = marca y estudiar · melocotón = puntos · mantequilla = rachas · menta = logros · cielo = amigos · noche = IA Premium */
:root{
  --bg:#F8F6FC; --surface:#FFFFFF; --surface-2:#F2F0F9; --surface-3:#E7E4F3; --line:#E6E3F1;
  --ink:#1D1B3A; --ink-2:#67647F; --on-ink:#FFFFFF;
  --indigo:#5B57E8; --indigo-press:#4743CF; --indigo-ink:#3D39C0; --indigo-soft:#E7E5FF;
  --lav:#D9D4FF; --lav-2:#C4BDFF;
  --sun:#FFD666; --sun-soft:#FFF3CC; --sun-ink:#7A5600;
  --peach:#FFB48A; --peach-soft:#FFE7D8; --peach-ink:#A9471A;
  --mint:#9FE0C4; --mint-soft:#DDF5EA; --mint-ink:#1B6E4C;
  --sky:#9ACDFF; --sky-soft:#E1F0FF; --sky-ink:#1C5F9E;
  --pink:#FF98AE; --pink-soft:#FFE3E9; --pink-ink:#A3264A;
  --danger:#D93A40; --danger-soft:#FDE4E4;
  --night:#14132E; --night-2:#1F1D45; --night-ink:#F3F1FF; --night-dim:rgba(243,241,255,.6); --night-line:rgba(243,241,255,.14);
  --shadow:0 1px 2px rgba(29,27,58,.04),0 10px 30px rgba(29,27,58,.07);
  --qr-bg:#FFFFFF; --scrim:rgba(20,19,46,.5);
  --f-display:'Outfit',system-ui,sans-serif;
  --f-text:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#100F24; --surface:#1B1A36; --surface-2:#24224A; --surface-3:#302E5A; --line:#2E2C55;
  --ink:#F1F0FF; --ink-2:#A9A6C8; --on-ink:#14132E;
  --indigo:#7C78FF; --indigo-press:#5B57E8; --indigo-ink:#B3B0FF; --indigo-soft:rgba(124,120,255,.18);
  --lav:#3A3670; --lav-2:#4A4590;
  --sun-soft:rgba(255,214,102,.14); --sun-ink:#FFDF8A; --peach-soft:rgba(255,180,138,.15); --peach-ink:#FFC3A1;
  --mint-soft:rgba(159,224,196,.14); --mint-ink:#A9EBD0; --sky-soft:rgba(154,205,255,.14); --sky-ink:#B5DBFF;
  --pink-soft:rgba(255,152,174,.15); --pink-ink:#FFB4C4; --danger:#FF6B6F; --danger-soft:rgba(255,107,111,.15);
  --shadow:0 1px 2px rgba(0,0,0,.2),0 10px 30px rgba(0,0,0,.25); --scrim:rgba(0,0,0,.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#100F24; --surface:#1B1A36; --surface-2:#24224A; --surface-3:#302E5A; --line:#2E2C55;
  --ink:#F1F0FF; --ink-2:#A9A6C8; --on-ink:#14132E;

  --sun-soft:rgba(255,214,102,.14); --sun-ink:#FFDF8A; --peach-soft:rgba(255,180,138,.15); --peach-ink:#FFC3A1;
  --mint-soft:rgba(159,224,196,.14); --mint-ink:#A9EBD0; --sky-soft:rgba(154,205,255,.14); --sky-ink:#B5DBFF;
  --pink-soft:rgba(255,152,174,.15); --pink-ink:#FFB4C4; --danger:#FF6B6F; --danger-soft:rgba(255,107,111,.15);

[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-text);font-size:15.5px;line-height:1.45;-webkit-font-smoothing:antialiased;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--indigo);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:700;letter-spacing:-.02em;margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:30px} h2{font-size:22px} h3{font-size:17.5px}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.small{font-size:13.5px}
.eyebrow{font:700 11.5px/1.2 var(--f-text);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}

/* ---------- Estructura ---------- */
.shell{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.shell.wide{max-width:1100px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:14px 10px;display:flex;flex-direction:column;gap:8px}
.topbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0}
.brand{font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:-.03em;display:flex;align-items:center;gap:9px}
.brand-mark{position:relative;display:inline-grid;place-items:center;width:34px;height:34px;border-radius:12px;background:var(--indigo);color:#fff;font-size:19px}
.brand-mark::after{content:"";position:absolute;width:11px;height:11px;border-radius:50%;background:var(--sun);top:-3px;right:-3px;border:2px solid var(--bg)}
.me-chip{display:flex;align-items:center;gap:10px;min-width:0}
.me-chip .who{display:flex;flex-direction:column;min-width:0}
.me-chip .who b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.demo-pill{font:800 10px/1 var(--f-mono);letter-spacing:.14em;background:var(--sun);color:#3A2A00;padding:6px 9px;border-radius:999px}
main{flex:1;padding-block:6px 120px;display:flex;flex-direction:column;gap:22px;min-width:0}
main.no-nav{padding-block:6px 40px}
section{display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:10px;align-items:center;justify-content:space-between;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}

/* ---------- Botones ---------- */
.btn{min-height:52px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;font-size:15.5px;padding:0 22px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:10px;text-align:center;transition:transform .08s,background .15s,box-shadow .15s}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.btn.accent{background:var(--indigo);border-color:var(--indigo);color:#fff}
.btn.reward{background:var(--peach);border-color:var(--peach);color:#3B1606}
.btn.sun{background:var(--sun);border-color:var(--sun);color:#3A2A00}
.btn.mint{background:var(--mint);border-color:var(--mint);color:#0E3A27}
.btn.danger{color:var(--danger);border-color:var(--danger-soft)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.small{min-height:40px;font-size:14px;padding:0 16px}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn .arr{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;background:#fff;color:#14132E;margin-right:-12px;font-size:16px}
.btn.split{justify-content:space-between;padding-left:24px}
.link{border:0;background:none;padding:0;color:var(--indigo-ink);font-weight:700;cursor:pointer;text-decoration:none;text-align:left}
.link:hover{text-decoration:underline}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:6px 11px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.reward{background:var(--peach-soft);color:var(--peach-ink)}
.chip.sage,.chip.mint{background:var(--mint-soft);color:var(--mint-ink)}
.chip.warn,.chip.sun{background:var(--sun-soft);color:var(--sun-ink)}
.chip.danger{background:var(--danger-soft);color:var(--danger)}
.chip.indigo{background:var(--indigo-soft);color:var(--indigo-ink)}
.chip.sky{background:var(--sky-soft);color:var(--sky-ink)}
.chip.pink{background:var(--pink-soft);color:var(--pink-ink)}
.chip.dark{background:var(--ink);color:var(--on-ink)}

/* ---------- Tarjetas ---------- */
.panel{background:var(--surface);border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--shadow);position:relative;overflow:hidden}
.panel > *{position:relative}
.tint-lav{background:var(--indigo-soft)} .tint-sun{background:var(--sun-soft)} .tint-peach{background:var(--peach-soft)}
.tint-mint{background:var(--mint-soft)} .tint-sky{background:var(--sky-soft)} .tint-pink{background:var(--pink-soft)}
.panel[class*="tint-"]{box-shadow:none}
.deco{position:absolute!important;border-radius:50%;pointer-events:none}
.list{display:flex;flex-direction:column}
.list > *{border-bottom:1px solid var(--line);padding-block:12px}
.list > *:last-child{border-bottom:0}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:14.5px}
.kv span:last-child{font-weight:700;text-align:right}
.pts{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--peach-ink);font-weight:800}
.note{font-size:14px;background:var(--surface-2);border-radius:18px;padding:12px 15px}
.note.reward{background:var(--peach-soft);color:var(--peach-ink)}
.note.danger{background:var(--danger-soft);color:var(--danger)}
.note.indigo{background:var(--indigo-soft);color:var(--indigo-ink)}
.note.mint{background:var(--mint-soft);color:var(--mint-ink)}
.note.sun{background:var(--sun-soft);color:var(--sun-ink)}
.field{display:flex;flex-direction:column;gap:6px}
.field > label,.field > .lbl{font-size:13.5px;font-weight:700}
.input,select.input,textarea.input{min-height:52px;border-radius:18px;border:1.5px solid transparent;background:var(--surface-2);padding:0 16px;width:100%}
textarea.input{padding:13px 16px;min-height:110px;resize:vertical;line-height:1.45}
.input:focus{border-color:var(--indigo);outline:none;background:var(--surface)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14.5px}
.check input{width:22px;height:22px;margin:0;accent-color:var(--indigo);flex:none}
.bar{height:12px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--peach);border-radius:inherit}
.bar.sage > i,.bar.mint > i{background:var(--mint)}
.bar.indigo > i{background:var(--indigo)}
details.more{background:var(--surface);border-radius:24px;padding:4px 18px;box-shadow:var(--shadow)}
details.more summary{cursor:pointer;font-weight:700;padding:14px 0;list-style:none;display:flex;justify-content:space-between}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"+";font-size:20px;line-height:1;color:var(--ink-2)}
details.more[open] summary::after{content:"–"}
.avatar{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:700 16px var(--f-display);color:#1D1B3A}
.avatar.small{width:34px;height:34px;font-size:13px}
.avatar.big{width:64px;height:64px;font-size:24px}
.av-0{background:#D9D4FF} .av-1{background:#FFD666} .av-2{background:#FFB48A} .av-3{background:#9FE0C4} .av-4{background:#9ACDFF} .av-5{background:#FF98AE}
.av-stack{display:flex}
.av-stack .avatar{border:2.5px solid var(--surface);margin-left:-10px}
.av-stack .avatar:first-child{margin-left:0}

/* ---------- Inicio del estudiante ---------- */
.hero{background:#E3DFFF;color:#1D1B3A;border-radius:32px;padding:22px;display:flex;flex-direction:column;gap:16px;position:relative;overflow:hidden}
.hero > *{position:relative;z-index:1}
.hero::before,.hero::after,.mode-tile::after,.ai-tool::after,.session-card::after{z-index:0}
.hero h1{font-size:28px;max-width:13ch}
.hero .eyebrow{color:inherit;opacity:.8}
.hero::before{content:"";position:absolute;width:150px;height:150px;border-radius:50%;background:var(--sun);right:-40px;top:-50px}
.hero::after{content:"";position:absolute;width:46px;height:46px;border-radius:50%;background:var(--pink);right:96px;top:26px}
.hero.night{background:#EDE6FF;color:#1D1B3A}
.hero.night::before{background:var(--sun)}
.hero.night::after{background:var(--pink)}
.hero.mint{background:var(--mint);color:#0E3A27} .hero.mint::before{background:var(--sun)} .hero.mint::after{background:var(--indigo)}
.hero.peach{background:var(--peach);color:#3B1606} .hero.peach::before{background:var(--sun)} .hero.peach::after{background:var(--indigo)}
.hero.sky{background:var(--sky);color:#0D2E4E} .hero.sky::before{background:var(--sun)} .hero.sky::after{background:var(--pink)}
.hero .btn.primary{background:#14132E;border-color:#14132E;color:#fff}

.hero-row{display:flex;gap:16px;align-items:center}
.hero-ring{position:relative;width:112px;height:112px;flex:none}
.hero-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.hero-ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.hero-ring b{font:800 28px/1 var(--f-display)}
.hero-ring small{font-size:11px;opacity:.85;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{border-radius:24px;padding:14px 12px;display:flex;flex-direction:column;gap:6px;min-width:0;position:relative;overflow:hidden;border:0;text-align:left;color:var(--ink)}
button.tile{cursor:pointer}
.tile .t-ico{width:34px;height:34px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:16px}
.tile b{font:800 25px/1 var(--f-display)}
.tile small{font-size:12px;font-weight:600;color:var(--ink-2)}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode-tile{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px;border-radius:28px;border:0;cursor:pointer;text-align:left;color:var(--ink);min-height:156px;transition:transform .08s}
.mode-tile:active{transform:scale(.97)}
.mode-tile > *{position:relative;z-index:1}
.mode-tile .num{width:48px;height:48px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font:800 17px var(--f-mono)}
.mode-tile b{font:700 17.5px/1.1 var(--f-display)}
.mode-tile span.s{font-size:12.5px;color:var(--ink-2);padding-right:30px}
.mode-tile .tag{position:absolute;top:14px;right:14px;background:var(--ink);color:var(--on-ink);border-radius:99px;padding:5px 9px;font-size:11px;font-weight:700}
.mode-tile .go{position:absolute;right:12px;bottom:12px;width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;font-size:15px}
.mode-tile::after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;right:-30px;bottom:-34px;background:var(--surface);opacity:.5}
.mode{display:flex;gap:14px;align-items:center;padding:14px;border:0;border-radius:24px;background:var(--surface);cursor:pointer;text-align:left;width:100%;box-shadow:var(--shadow);color:var(--ink)}
.mode[aria-current="true"]{outline:2px solid var(--indigo)}
.mode .ico{flex:none;width:48px;height:48px;border-radius:50%;background:var(--indigo-soft);display:grid;place-items:center;color:var(--indigo-ink);font:800 13px var(--f-mono)}
.mode .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mode .txt b{font-weight:700;font-size:16px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:150px}
.week .col{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.week .col i{display:block;width:100%;max-width:30px;border-radius:99px;background:var(--lav);min-height:8px}
.week .col.today i{background:var(--sun)}
.week .col small{font-size:11.5px;color:var(--ink-2);font-weight:700}
.week .col em{font:700 10.5px var(--f-mono);font-style:normal;color:var(--ink-2)}
.promo{display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:28px;background:var(--surface);box-shadow:var(--shadow);position:relative;overflow:hidden}
.promo > *{position:relative}
.promo .local{font-size:13px;color:var(--ink-2);font-weight:700}
.promo h3{font-size:19px}
.promo .cond{font-size:14.5px}
.promo .cond b{font-weight:700}
.big-num{font:800 56px/1 var(--f-display);letter-spacing:-.03em}
.nav{position:fixed;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:25;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.nav-in{pointer-events:auto;max-width:448px;margin:0 auto;display:flex;gap:4px;background:var(--surface);border-radius:999px;padding:7px;box-shadow:0 10px 30px rgba(29,27,58,.14);border:1px solid var(--line)}
.nav button{flex:1;min-width:0;border:0;background:none;border-radius:999px;height:52px;display:flex;align-items:center;justify-content:center;gap:7px;font-size:13px;font-weight:700;color:var(--ink-2);cursor:pointer}
.nav button svg{width:24px;height:24px;flex:none}
.nav button span{display:none}
.nav button[aria-current="page"]{flex:2.3;background:#FFE7D8;color:#1D1B3A}
.nav button[aria-current="page"] span{display:inline;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- Sesión ---------- */
.session{position:fixed;inset:0;z-index:40;background:var(--night);color:var(--night-ink);display:flex;flex-direction:column;align-items:center;overflow:auto;
  padding:calc(env(safe-area-inset-top,0px) + 18px) max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 20px) max(20px,env(safe-area-inset-left,0px))}
.session::before{content:"";position:fixed;width:260px;height:260px;border-radius:50%;background:var(--night-2);top:-90px;right:-90px}
.session-in{width:100%;max-width:440px;flex:1;display:flex;flex-direction:column;gap:16px;position:relative}
.session .tag{font:700 11px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--night-dim)}
.ring{position:relative;width:min(72vw,280px);aspect-ratio:1;max-width:100%;margin:4px auto 0}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center}
.ring .time{font:800 56px/1 var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.dots{display:flex;gap:7px;justify-content:center}
.dots i{width:11px;height:11px;border-radius:50%;background:var(--night-line)}
.dots i.done{background:var(--sun)}
.dots i.now{background:#C4BDFF}
.msg{text-align:center;font-size:16px;font-weight:600;min-height:44px;text-wrap:balance}
.session .btn{background:transparent;border-color:var(--night-line);color:var(--night-ink)}
.session .btn.primary{background:var(--sun);border-color:var(--sun);color:#2B1F00}
.session .btn.reward{background:var(--peach);border-color:var(--peach);color:#3B1606}
.session-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.session .stats{display:flex;justify-content:center;gap:26px;font-size:12.5px;color:var(--night-dim)}
.session .stats b{display:block;color:var(--night-ink);font:800 19px var(--f-mono);text-align:center}
.group-strip{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.group-strip span{background:var(--night-2);border-radius:99px;padding:6px 11px;font-size:12.5px;font-weight:600}
.group-strip span.out{background:rgba(255,152,174,.18);color:#FFC1CE}
.group-strip span.ok::before{content:"● ";color:var(--mint)}
.dark-overlay{position:fixed;inset:0;z-index:60;background:#000;display:flex;align-items:flex-end;justify-content:center;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 40px);cursor:pointer}
.dark-overlay p{font:700 11px var(--f-mono);letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.14)}

/* ---------- Capas ---------- */
.sheet-back{position:fixed;inset:0;z-index:70;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:500px;border-radius:32px 32px 0 0;max-height:92%;overflow:auto;
  padding:26px max(20px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.sheet-back{align-items:center}.sheet{border-radius:32px}}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 14px);z-index:90;background:#14132E;color:#fff;padding:12px 20px;border-radius:999px;font-size:14.5px;font-weight:600;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.25);text-align:center}
#confetti{position:fixed;inset:0;z-index:95;pointer-events:none;width:100%;height:100%}
.celebrate{animation:pop .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}

/* ---------- Canje ---------- */
.check-code{font:800 68px/1 var(--f-mono);letter-spacing:.12em;text-align:center}
.live-clock{font:800 26px var(--f-mono);font-variant-numeric:tabular-nums;text-align:center}
.pulse{width:16px;height:16px;border-radius:50%;background:var(--peach);margin:0 auto;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.7);opacity:.35}}
.code-input{font:800 30px var(--f-mono);letter-spacing:.3em;text-align:center;min-height:66px}

/* ---------- Local, familias y panel ---------- */
.redemption{border-radius:28px;background:var(--surface);padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.redemption.new{outline:2.5px solid var(--peach)}
.redemption .code{font:800 36px var(--f-mono);letter-spacing:.1em}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.tabs button{border:0;background:var(--surface);border-radius:999px;padding:10px 16px;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;color:var(--ink-2);box-shadow:var(--shadow)}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days label{position:relative}
.days input{position:absolute;opacity:0;inset:0}
.days span{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--surface-2);font-weight:700;font-size:13.5px;cursor:pointer}
.days input:checked + span{background:var(--indigo);color:#fff}
.days input:focus-visible + span{outline:3px solid var(--indigo);outline-offset:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.timeline{display:flex;flex-direction:column}
.timeline .ev{display:flex;gap:12px;align-items:flex-start;padding-block:10px}
.timeline .ev .dot{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:12px;margin-top:1px}
.timeline .ev .dot.ok{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.timeline .ev .dot.bad{background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}
.timeline .ev .dot.live{background:var(--mint);border-color:var(--mint)}
.timeline .ev .tm{flex:none;width:46px;font:700 12.5px var(--f-mono);color:var(--ink-2);padding-top:5px}
.timeline .ev .bd{flex:1;min-width:0}
.qr-mini{width:190px;max-width:100%;background:#fff;padding:12px;border-radius:22px;margin:0 auto}
.qr-mini svg{width:100%;height:auto;display:block}

/* ---------- Amigos ---------- */
.post{background:var(--surface);border-radius:28px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.post-head{display:flex;gap:10px;align-items:center}
.post-head .who{flex:1;min-width:0;display:flex;flex-direction:column}
.post-head .who b{font-weight:700}
.post img{width:100%;border-radius:20px;display:block;max-height:420px;object-fit:cover;background:var(--surface-2)}
.session-card{border-radius:22px;padding:16px;background:var(--indigo-soft);color:var(--indigo-ink);display:flex;justify-content:space-between;gap:10px;align-items:center;position:relative;overflow:hidden}
.session-card > *{position:relative;z-index:1}
.session-card b{font:800 28px/1 var(--f-display)}
.session-card::after{content:"";position:absolute;width:70px;height:70px;border-radius:50%;background:var(--sun);right:-20px;top:-26px}
.reacts{display:flex;gap:6px;flex-wrap:wrap}
.react{border:0;background:var(--surface-2);border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;cursor:pointer}
.react[aria-pressed="true"]{background:var(--indigo-soft);color:var(--indigo-ink)}
.comment{display:flex;gap:8px;font-size:14px}
.comment b{font-weight:700}
.rank{display:flex;align-items:center;gap:12px}
.rank .pos{width:28px;font:800 17px var(--f-display);color:var(--ink-2);text-align:center}
.rank.me{background:var(--sun-soft);border-radius:18px;padding-inline:8px}
.live-dot{width:10px;height:10px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 4px var(--mint-soft);flex:none}
.scroller{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.friend-bubble{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;width:72px;text-align:center;font-size:12px;font-weight:600;overflow:hidden}
.friend-bubble span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.friend-bubble .avatar{width:56px;height:56px;font-size:20px}
.friend-bubble .avatar.live{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--mint)}

/* ---------- IA ---------- */
.ai-out{font-size:15px;line-height:1.55;display:flex;flex-direction:column;gap:8px;overflow-wrap:anywhere}
.ai-out h4{margin:6px 0 0;font-size:16.5px}
.ai-out ul,.ai-out ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.ai-out code{font-family:var(--f-mono);background:var(--surface-2);border-radius:6px;padding:1px 5px;font-size:13px}
.chat{display:flex;flex-direction:column;gap:10px}
.bubble{border-radius:22px;padding:12px 15px;max-width:88%}
.bubble.me{align-self:flex-end;background:var(--indigo);color:#fff;border-bottom-right-radius:6px}
.bubble.ai{align-self:flex-start;background:var(--surface);box-shadow:var(--shadow);border-bottom-left-radius:6px}
.ai-tools{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ai-tool{position:relative;overflow:hidden;border:0;border-radius:26px;padding:16px;min-height:140px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px;color:var(--ink)}
.ai-tool > *{position:relative;z-index:1}
.ai-tool b{font:700 16.5px/1.15 var(--f-display)}
.ai-tool span.s{font-size:12.5px;color:var(--ink-2)}
.ai-tool .lock{position:absolute;top:12px;right:12px;font-size:11px;font-weight:700;background:var(--ink);color:var(--on-ink);border-radius:99px;padding:4px 8px}
.ai-tool .e{width:42px;height:42px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:20px}
.ai-tool::after{content:"";position:absolute;width:80px;height:80px;border-radius:50%;right:-26px;bottom:-30px;background:var(--surface);opacity:.5}
.q-card{background:var(--surface);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.q-card .opt.right{background:var(--mint-soft);border-color:var(--mint);color:var(--mint-ink)}
.q-card .opt.wrong{background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}
.plan-day{display:flex;gap:12px;align-items:flex-start}
.plan-day .d{flex:none;width:56px;text-align:center;border-radius:18px;background:var(--indigo-soft);color:var(--indigo-ink);padding:7px 0;font-weight:700;font-size:11.5px}
.plan-day .d b{display:block;font:800 19px var(--f-display)}
.plan-day.today .d{background:var(--sun);color:#3A2A00}
.price{font:800 40px/1 var(--f-display)}

/* ---------- Mostrador ---------- */
.counter{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding-block:20px 40px;text-align:center}
.qr-card{background:var(--qr-bg);padding:18px;border-radius:30px;box-shadow:var(--shadow);width:min(78vw,340px);aspect-ratio:1;max-width:100%;display:grid;place-items:center}
.qr-card #qr{width:100%;height:100%;display:grid;place-items:center}
.qr-card svg{width:100%;height:auto;display:block}
.code6{font:800 clamp(40px,11vw,64px)/1 var(--f-mono);letter-spacing:.14em;font-variant-numeric:tabular-nums}
.timer-bar{width:min(78vw,340px);max-width:100%}
.watermark{font:800 11px var(--f-mono);letter-spacing:.3em;color:var(--peach-ink)}

/* ---------- Test ---------- */
.q-opts{display:flex;flex-direction:column;gap:10px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:20px;padding:14px 16px;text-align:left;font-weight:600;cursor:pointer;width:100%;color:var(--ink)}
.opt[aria-pressed="true"]{background:var(--indigo-soft);border-color:var(--indigo);color:var(--indigo-ink)}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.scale .opt{text-align:center;font:800 20px var(--f-mono);padding:15px 0}
.progress{height:10px;display:flex;gap:4px}
.progress i{flex:1;background:var(--surface-3);border-radius:99px}
.progress i.on{background:var(--indigo)}

/* ---------- Bienvenida ---------- */
.welcome{background:var(--lav);color:#1D1B3A;border-radius:36px;padding:24px 22px 22px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:12px}
.welcome > *{position:relative}
.welcome h1{font-size:33px;max-width:12ch}
.welcome svg.ill{width:100%;max-width:280px;height:auto;align-self:center}
.welcome .eyebrow{color:#4A4770}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal em{font:700 11px var(--f-text);font-style:normal;color:var(--ink-2);text-align:center}
.cal span{aspect-ratio:1;border-radius:9px;display:grid;place-items:center;font:700 12px var(--f-mono);color:var(--ink)}
/* Tablet: más ancho y más columnas */
@media (min-width:720px){.shell{max-width:720px}.mode-grid{grid-template-columns:repeat(3,1fr)}.tiles{gap:16px}.nav-in{max-width:560px}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.demo-pill{display:none!important}</style>

  const picked = new Set(Array.isArray(v) ? v : [v]);
  const list = valid.filter((x) => picked.has(x)); // orden canónico, sin duplicados
  return list.length ? list : null;
}

/* ============================================================
   Decisión
   Cada regla puede dejar una "duda": { level, alternative, reason }.
     media → la respuesta está justo en el límite o las señales se contradicen
     baja  → falta una respuesta que podría haber cambiado el resultado
   La duda más fuerte fija confidence y secondaryProfile.
   ============================================================ */
const IMPUTED_SCALE = 3; // punto medio de la escala 1-5
const IMPUTED_SPAN = '15_30'; // sin dato → bloques cortos (Pomodoro), el modo más estándar
const LATE_THRESHOLD = 8;

/** Ítems 1-5 (reglas 2 a 5). No mira la fecha del examen. */
function decideBase(a) {
  const rest = decideRest(a);
  const s = startSum(a.hardToStart, a.leavesForLast);
  const isLate = s.value >= LATE_THRESHOLD;
  const uncertain = s.min < LATE_THRESHOLD && s.max >= LATE_THRESHOLD; // la respuesta que falta decidiría
  const borderline = s.min === s.max && (s.value === LATE_THRESHOLD || s.value === LATE_THRESHOLD - 1);

  if (isLate) {
    const doubts = [];
    if (uncertain) doubts.push({ level: 'baja', alternative: rest.profile, reason: 'Falta una de las dos primeras respuestas; la hemos tomado como neutra.' });
    else if (borderline) doubts.push({ level: 'media', alternative: rest.profile, reason: 'Estás justo en el límite entre este perfil y el siguiente.' });
    return { profile: 'arranca_tarde', doubts, reasons: ['Te cuesta ponerte o sueles dejarlo para el final.'] };
  }

  const doubts = [];
  if (uncertain) doubts.push({ level: 'baja', alternative: 'arranca_tarde', reason: 'Falta una de las dos primeras respuestas; con ella podrías ser "El que arranca tarde".' });
  else if (borderline) doubts.push({ level: 'media', alternative: 'arranca_tarde', reason: 'Te ha faltado un punto para "El que arranca tarde".' });
  return { profile: rest.profile, doubts: [...doubts, ...rest.doubts], reasons: rest.reasons };
}

/** Suma de los ítems 1 y 2, con el rango posible si falta alguno. */
function startSum(x, y) {
  const lo = (v) => (v ?? 1);
  const hi = (v) => (v ?? 5);
  const mid = (v) => (v ?? IMPUTED_SCALE);
  return { value: mid(x) + mid(y), min: lo(x) + lo(y), max: hi(x) + hi(y) };
}

/** Reglas 3 a 5. */
function decideRest(a) {
  const long = decideLong(a);
  const spanMissing = a.focusSpan === null;
  const span = a.focusSpan ?? IMPUTED_SPAN;

  if (span === 'menos_15' || span === '15_30') {
    if (spanMissing) {
      return {
        profile: 'rafagas',
        doubts: [{ level: 'baja', alternative: long.profile, reason: 'No sabemos cuánto aguantas concentrado, así que empezamos con bloques cortos.' }],
        reasons: ['Empezamos con bloques cortos (Pomodoro) hasta conocer tu ritmo.'],
      };
    }
    return { profile: 'rafagas', doubts: [], reasons: ['Aguantas menos de 30 min concentrado.'] };
  }
  return long;
}

/** Reglas 4 y 5: ítem 3 ≥ 30 min. */
function decideLong(a) {
  const methods = a.studyMethods;
  const check = a.selfCheck;
  const passiveOnly = methods !== null && methods.every((m) => PASSIVE_METHODS.has(m));
  const never = check === 'nunca';

  if (passiveOnly || never) {
    const mixed = (passiveOnly && check === 'siempre') || (!passiveOnly && methods !== null && never);
    return {
      profile: 'maratoniano',
      doubts: mixed ? [{ level: 'media', alternative: 'profundo', reason: 'Tus respuestas sobre cómo estudias apuntan en dos direcciones.' }] : [],
      reasons: ['Aguantas bloques largos, pero estudias sobre todo releyendo o sin comprobar lo que sabes.'],
    };
  }

  const doubts = [];
  if (methods === null && check !== 'siempre') {
    doubts.push({
      level: check === null ? 'baja' : 'media',
      alternative: 'maratoniano',
      reason: 'No sabemos bien cómo estudias; si es sobre todo releyendo, te iría mejor "El maratoniano".',
    });
  }
  return { profile: 'profundo', doubts, reasons: ['Aguantas bloques largos y ya estudias de forma activa.'] };
}

const RANK = { baja: 0, media: 1, alta: 2 };
const worstDoubt = (doubts) =>
  doubts.reduce((w, d) => (w === null || RANK[d.level] < RANK[w.level] ? d : w), null);

/* ============================================================
   Modificadores: preferencias, no cambian el perfil
   ============================================================ */
function buildModifiers(a) {
  return {
    plan: a.planning ?? 'diario',        // sin respuesta → flexible (sesión sugerida del día)
    timeOfDay: a.bestTime,               // null → no programamos avisos hasta conocer tu franja
    format: a.reviewFormat,              // null → sugerencias sin personalizar
    examTypes: a.examTypes ?? [],
    nextExam: a.nextExam ?? 'no_lo_se',  // sin respuesta = "no lo sé"
  };
}

const DEFAULT_MODIFIERS = Object.freeze(buildModifiers(normalizeAnswers({}).answers));

   API pública
   ============================================================ */

/**
 * Clasifica al usuario. Pura: misma entrada → misma salida, no modifica `rawAnswers`,
 * no lee la fecha ni el almacenamiento. Nunca lanza: respuestas vacías o no válidas
 * se tratan como "sin respuesta" y se listan en `missing`.
 *
 * @param {object} rawAnswers  { hardToStart, leavesForLast, focusSpan, studyMethods, selfCheck,
 *                               planning, bestTime, nextExam, examTypes, reviewFormat }
 */
function classifyProfile(rawAnswers) {
  const { answers: a, missing } = normalizeAnswers(rawAnswers);
  const base = decideBase(a);
  const modifiers = buildModifiers(a);

  let profile, secondaryProfile, confidence, reasons;

  if (a.nextExam === 'menos_2_sem') {
    // Regla 1. Es un dato, no una estimación: confianza alta.
    // secondaryProfile = perfil al que volver cuando pase el examen.
    profile = 'contrarreloj';
    secondaryProfile = base.profile;
    confidence = 'alta';
    reasons = [
      'Tu próximo examen importante es en menos de 2 semanas.',
      `Cuando pase, volverás a tu perfil habitual: ${PROFILES[base.profile].label}.`,
    ];
  } else {
    // "No lo sé" o sin respuesta: no hay plazo conocido → se aplican las reglas 2-5.
    const worst = worstDoubt(base.doubts);
    profile = base.profile;
    confidence = worst ? worst.level : 'alta';
    secondaryProfile = worst && worst.alternative !== profile ? worst.alternative : null;
    reasons = worst ? [...base.reasons, worst.reason] : [...base.reasons];
    if (modifiers.nextExam === 'no_lo_se') {
      reasons.push('Cuando sepas la fecha de tu examen, añádela y ajustamos el plan.');
    }
  }

  return {
    profile,
    label: PROFILES[profile].label,
    defaultMode: cloneMode(profile),
    modifiers,
    secondaryProfile,
    confidence,
    reasons,
    missing,
    algorithmVersion: ALGORITHM_VERSION,
  };
}

/**
 * Perfil elegido a mano por el usuario. Conserva sus preferencias (modifiers).
 * @throws {Error} si el id no es uno de los 5 perfiles.

function profileFromChoice(profileId, modifiers = DEFAULT_MODIFIERS) {
  if (!PROFILE_IDS.includes(profileId)) throw new Error(`Perfil desconocido: ${profileId}`);

    profile: profileId,
    label: PROFILES[profileId].label,
    defaultMode: cloneMode(profileId),
    modifiers: { ...modifiers, examTypes: [...(modifiers.examTypes ?? [])] },
  };
}

  else if (rawTotal < 0.5) why = isChildSession() ? 'A partir de las 22:00 el estudio no suma puntos: mejor descansar y seguir mañana.' : 'Has estudiado de madrugada (de 00:00 a 07:00). Ese tiempo no suma puntos: mejor dormir y seguir mañana.';
  else {
    const gross = Math.floor(rawTotal * v * mult);
    pts = Math.max(0, Math.min(gross, capFor() - w.earnedToday));
    if (pts < gross) why = `Has llegado al tope de ${capFor()} puntos de hoy.`;
  }
  if (pts > 0) st.ledger.push({ id: uid(), type: 'earn', pts, at: t, day: today, vestAt: t + vestH * H, note: `${m.name}${m.guided ? ` · ${sess.blocksDone} bloque${sess.blocksDone === 1 ? '' : 's'}` : ` · ${fmtDur(focus)}`}` });
  st.sessionsLog = st.sessionsLog || [];
  const logEntry = { id: uid(), at: sess.startedAt, end: t, mode: sess.mode, focus: Math.round(focus), blocks: sess.blocksDone, exits: sess.exits, pauses: sess.pauses, reason, pts, groupId: sess.groupId || null };
  if (focus >= 1 || reason === 'exit') st.sessionsLog.push(logEntry); if (st.sessionsLog.length > 200) st.sessionsLog.shift();
  referralOnSession(st, focus, t);
  if (acc.type === 'child') notifyGuardians(reason === 'exit'
    ? `${st.user.name} ha salido de Envés y la sesión se ha cerrado (${fmtDur(focus)} de foco).`
    : `${st.user.name} ha terminado de estudiar: ${fmtDur(focus)} de foco${pts ? `, ${pts} puntos` : ''}.`, reason === 'exit' ? 'abandon' : 'end');
  const gid = sess.groupId;
  ui.lastSummary = { reason, mode: m.name, modeId: sess.mode, guided: m.guided, focus, blocks: sess.blocksDone, exits: sess.exits, pauses: sess.pauses, pickups: sess.pickups, pts, why, mult, streakUp, streak: effectiveStreak(), vestAt: t + vestH * H, logId: logEntry.id, groupId: gid,
    lostBlock: m.guided && reason !== 'complete' && sess.pos > 0.05 && ['focus', 'away', 'interrupted'].includes(sess.phase) };
  sess = null; setDark(false); wakeOff();
  setLive({ status: reason === 'exit' ? 'out' : 'done', mode: logEntry.mode, since: t, groupId: gid });
  save();
  ui.sheet = { type: 'summary' };
  render(); renderLayer();
  if (pts > 0 || streakUp) setTimeout(() => celebrate(streakUp ? 'big' : 'normal'), 120);
}

/* Salidas de la app (Page Visibility API) */
document.addEventListener('visibilitychange', () => {
  if (!sess) return;
  if (document.visibilityState === 'hidden') {
    if (sess.phase === 'focus') { sess.phase = 'away'; sess.leftAt = Date.now(); setLive({ ...(ST().live || {}), status: 'away' }); }
    return;
  }
  sess.last = Date.now();
  if (sess.phase !== 'away') { renderLayer(); return; }
  const awayMs = Date.now() - sess.leftAt;
  const graceAllowed = sess.graceUsed < CFG.graceMaxPer25Min * Math.max(1, Math.ceil(sess.focusTotal / 25));
  if (awayMs <= CFG.exitGraceSec * 1000 && graceAllowed) { sess.graceUsed++; sess.phase = 'focus'; setLive({ ...(ST().live || {}), status: 'studying' }); toast('Salida breve: no cuenta. ¡Sigue!'); renderLayer(); return; }
  const m = MODES[sess.mode];
  sess.awayMs = awayMs; buzz([40, 60, 40]);
  if (ACC().type === 'child') notifyGuardians(`${ST().user.name} ha salido de Envés durante la sesión (${Math.round(awayMs / 1000)} s).`, 'away');
  if (!m.guided) { sess.exits++; sess.phase = 'interrupted'; ui.sheet = { type: 'away' }; renderLayer(); return; }
  const wc = ST().wildcards; if (wc.day !== dayKey(now())) { wc.day = dayKey(now()); wc.used = 0; }
  if (wc.used < CFG.wildcardsPerDay && awayMs <= CFG.wildcardMaxMin * MIN) { sess.phase = 'interrupted'; ui.sheet = { type: 'wildcard' }; renderLayer(); return; }
  finishSession('exit');
});

function setDark(on) { const el = $('#dark'); if (el) el.hidden = !on; }
function buzz(p) { try { navigator.vibrate?.(p); } catch { /* sin vibración */ } }

/* ---------------------------------------------------------------- Canje (estudiante) */
async function startRedeem(promoId, code) {
  const p = S.promos.find((x) => x.id === promoId); const m = S.merchants[p.merchantId];
  const w = wallet(); const block = redeemBlock(p, w);
  if (block) return { error: block };
  if (m.status !== 'active' || !m.device?.active) return { error: 'Este local no está aceptando canjes ahora mismo.' };
  const clean = String(code).replace(/\D/g, '');
  if (clean.length !== 6) return { error: 'El código tiene 6 cifras.' };
  const w0 = qrWindow(); let match = null;
  for (const ww of [w0 - 1, w0, w0 + 1]) { if ((await codeFor(m, ww)).code6 === clean) { match = ww; break; } }
  if (match === null) return { error: 'Ese código no es del mostrador de este local o ya ha cambiado. Mira la pantalla y prueba con el nuevo.' };
  const useKey = `${ST().user.alias}:${m.device.id}:${match}`;
  if (S.usedWindows[useKey]) return { error: 'Ya has usado este código. Espera al siguiente (cambia cada 30 s).' };
  S.usedWindows[useKey] = true;
  const letters = 'ABCDEFGHJKLMNPQRSTUVWXYZ'; let cc = ''; for (let i = 0; i < 3; i++) cc += letters[Math.floor(Math.random() * letters.length)];
  const r = { id: uid(), promoId, merchantId: m.id, title: p.title, minSpend: p.minSpend, points: promoPoints(p), level: p.level, alias: ST().user.alias,
    checkCode: cc, createdAt: now(), expiresAt: now() + CFG.redemptionTtlMin * MIN, status: 'pending', window: match, deviceId: m.device.id };
  S.redemptions.push(r); save();
  return { ok: r };
}

function weekChart(log) {
  const t = now(), wk = weekKey(t), today = dayKey(t);
  const [y, m, d] = wk.split('-').map(Number);
  const days = Array.from({ length: 7 }, (_, i) => { const dt = new Date(Date.UTC(y, m - 1, d + i)); return dt.toISOString().slice(0, 10); });
  const mins = days.map((k) => (log || []).filter((e) => dayKey(e.end || e.at) === k).reduce((a, e) => a + (e.focus || 0), 0));
  const max = Math.max(60, ...mins), total = mins.reduce((a, b) => a + b, 0);
  return { total, html: `<div class="week" role="img" aria-label="Minutos de foco de esta semana: ${mins.map((v, i) => `${DAYS[i]} ${v}`).join(', ')}">${days.map((k, i) => `<div class="col ${k === today ? 'today' : ''}"><em>${mins[i] ? mins[i] : ''}</em><i style="height:${Math.max(6, Math.round((mins[i] / max) * 100))}%"></i><small>${DAYS[i]}</small></div>`).join('')}</div>` };
}
function heroRing(val, max, label, sub) {
  const f = Math.max(0, Math.min(1, val / max)), C = 2 * Math.PI * 50;
  return `<div class="hero-ring"><svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="50" fill="none" stroke="rgba(29,27,58,.1)" stroke-width="11"/><circle cx="60" cy="60" r="50" fill="none" stroke="#5B57E8" stroke-width="11" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C * (1 - f)).toFixed(1)}"/></svg><div class="in"><b>${label}</b><small>${sub}</small></div></div>`;
}

async function tickCounter() {
  const a = ACC(); if (!SESSION.counter || !a || a.type !== 'owner') return;
  const m = MER(); if (!m.device?.active) return;
  const ms = now(), w = qrWindow(), frac = (ms % (CFG.qrWindowSec * 1000)) / (CFG.qrWindowSec * 1000);
  const bar = $('#qr-bar'); if (bar) bar.style.width = `${(1 - frac) * 100}%`;
  const left = $('#qr-left'); if (left) left.textContent = `Cambia en ${Math.ceil((1 - frac) * CFG.qrWindowSec)} s`;
  if (w === counterLast) return;
  counterLast = w;
  const { code6, qr } = await codeFor(m, w);
  const c = $('#code6'); if (c) c.textContent = `${code6.slice(0, 3)} ${code6.slice(3)}`;
  const box = $('#qr'); if (!box) return;
  try {
    if (typeof qrcode === 'function') { const q = qrcode(0, 'M'); q.addData(qr); q.make(); box.innerHTML = q.createSvgTag({ cellSize: 8, margin: 0, scalable: true, title: 'QR del mostrador' }); }
    else box.innerHTML = '<p class="small" style="color:#10201C">QR no disponible: usa el código.</p>';
  } catch { box.innerHTML = '<p class="small" style="color:#10201C">QR no disponible: usa el código.</p>'; }
}

/* ---------------------------------------------------------------- Capas: sesión y hojas */
function renderLayer() {
  const layer = $('#layer'); let html = '';
  if (sess) html += sessionHtml();
  if (ui.sheet) html += sheetHtml();
  layer.innerHTML = html;
  if (sess) updateSessionDom();
  const f = layer.querySelector('[data-autofocus]'); if (f) f.focus();
}
function sessionHtml() {
  const m = MODES[sess.mode];
  const dots = m.guided ? `<div class="dots" aria-label="Bloques">${Array.from({ length: m.cycles }, (_, i) => `<i class="${i < sess.blocksDone ? 'done' : i === sess.blocksDone ? 'now' : ''}"></i>`).join('')}</div>` : '';
  const canNext = sess.phase === 'break' || sess.phase === 'awaitNext';
  return `<div class="session" role="dialog" aria-label="Sesión de estudio"><div class="session-in">
    <div class="spread"><span class="tag">${m.name}</span><span class="tag" id="s-band"></span></div>
    <div class="ring"><svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="54" fill="none" stroke="rgba(243,241,255,.1)" stroke-width="7"/><circle id="s-arc" cx="60" cy="60" r="54" fill="none" stroke="#FFD666" stroke-width="7" stroke-linecap="round" stroke-dasharray="339.3" stroke-dashoffset="339.3"/></svg>
      <div class="center"><span class="tag" id="s-phase"></span><span class="time" id="s-time">00:00</span><span class="small" style="color:var(--night-dim)" id="s-sub"></span></div></div>
    ${dots}
    <p class="msg" id="s-msg">${esc(sess.msg)}</p>
    ${sess.groupId ? '<div class="group-strip" id="s-group"></div>' : ''}
    <div class="stats"><div><b id="s-pts">0</b>puntos</div><div><b id="s-exits">0</b>salidas</div><div><b id="s-focus">0</b>min de foco</div></div>
    <div class="session-foot">
      ${sess.phase === 'paused' ? '<button class="btn primary block" data-act="pause-end">Volver a estudiar</button>' : canNext ? '<button class="btn reward block" data-act="next-block">Siguiente bloque</button>' : `<button class="btn primary block" data-act="dark">Pantalla negra · ponlo boca abajo</button>
      <div class="grid2"><button class="btn small" data-act="pause" data-k="call" ${sess.callsUsed >= CFG.pause.callMax ? 'disabled' : ''}>📞 Llamada · ${CFG.pause.callMin} min</button><button class="btn small" data-act="pause" data-k="msg" ${msgPausesLeft() <= 0 ? 'disabled' : ''}>💬 Mensaje · ${CFG.pause.msgMin} min</button></div>`}
      <button class="btn block" data-act="end">${m.guided && sess.phase === 'focus' ? 'Terminar (pierdes este bloque)' : 'Terminar sesión'}</button>
      ${S.speed > 1 ? `<p class="small" style="text-align:center;color:var(--night-dim)">Demo a velocidad ×${S.speed}</p>` : ''}
    </div></div></div>`;
}
function updateSessionDom() {
  if (!sess || !$('#s-time')) return;
  const m = MODES[sess.mode];
  let time = 0, frac = 0, phase = '', sub = '';
  if (sess.phase === 'paused') { time = sess.pause.left; frac = 1 - sess.pause.left / sess.pause.total; phase = sess.pause.kind === 'call' ? 'Pausa · llamada' : 'Pausa · mensajes'; sub = 'no penaliza · no suma'; }
  else if (sess.phase === 'focus' || sess.phase === 'away' || sess.phase === 'interrupted') {
    if (m.guided) { time = m.focus - sess.pos; frac = sess.pos / m.focus; sub = `bloque ${sess.blocksDone + 1} de ${m.cycles}`; }
    else { time = sess.focusTotal; frac = Math.min(1, sess.focusTotal / CFG.freeAutocloseMin); sub = `se cierra sola a las ${CFG.freeAutocloseMin / 60} h`; }
    phase = sess.phase === 'focus' ? 'Foco' : 'En pausa';
  } else if (sess.phase === 'break') { time = sess.breakLeft; frac = 1 - sess.breakLeft / (m.longBreak && sess.blocksDone % 4 === 0 ? m.longBreak : m.brk); phase = 'Descanso'; sub = 'el móvil puede esperar'; }
  else if (sess.phase === 'awaitNext') { time = sess.awaitLeft; frac = 1 - sess.awaitLeft / CFG.guidedNextBlockExtraMin; phase = '¿Seguimos?'; sub = 'si no, la sesión se cierra'; }
  $('#s-time').textContent = fmtClock(time);
  $('#s-phase').textContent = phase; $('#s-sub').textContent = sub;
  $('#s-arc').setAttribute('stroke-dashoffset', String(339.3 * (1 - Math.max(0, Math.min(1, frac)))));
  $('#s-pts').textContent = fmt(liveEstimate());
  $('#s-exits').textContent = String(sess.exits);
  $('#s-focus').textContent = String(Math.floor(sess.focusTotal));
  const b = band(now()); $('#s-band').textContent = `×${String(b.x).replace('.', ',')} · ${b.label}`;
  $('#s-msg').textContent = sess.msg;
  const g = $('#s-group'); if (g) g.innerHTML = groupStripHtml(sess.groupId);
}

/* ---------------------------------------------------------------- Toast */
let toastT = null;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 3200); }

/* ================================================================ ACCIONES */
// Cada acción comprueba el tipo de cuenta: una cuenta no puede ejecutar acciones de otra interfaz.
const need = (...types) => { const a = ACC(); return !!a && types.includes(a.type); };

const ACT = {
  /* Cuenta y acceso */
  auth(b) { ui.auth = { ...ui.auth, step: b.dataset.step, error: null }; render(); window.scrollTo(0, 0); },
  'auth-method'(b) { const p = b.dataset.p; ui.auth = { step: ['google', 'apple', 'microsoft'].includes(p) ? 'provider' : p, p }; render(); window.scrollTo(0, 0); setTimeout(() => $('#main-first, .input')?.focus(), 30); },
  'demo-login'(b) { const a = S.accounts[b.dataset.id]; resolveIdentity(a.identities[0]); },
  logout() { logout(); },
  'signup-student'() { ui.onb = { step: 'uni', q: 0, answers: {}, idn: ui.auth.idn }; render(); window.scrollTo(0, 0); },
  'signup-local'() { ui.auth = { ...ui.auth, step: 'local-form' }; render(); window.scrollTo(0, 0); },
  'cancel-onb'() { const idn = ui.onb?.idn; ui.onb = null; ui.auth = { step: 'choose', idn }; render(); },
  'skip-test'() { ui.onb.answers = {}; ui.onb.result = classifyProfile({}); ui.onb.step = 'resultado'; render(); window.scrollTo(0, 0); },
  'renew-uni'() { if (!need('student')) return; const a = ACC(); a.renewCode = newCode(); save(); ui.sheet = { type: 'renew' }; renderLayer(); },
  'demo-expire'() { if (!need('student')) return; ACC().uni.validUntil = now() - 1; save(); render(); toast('Demo: la verificación universitaria ha caducado.'); },

  /* Estudiante */
  tab(b) { if (!need('student', 'child', 'parent')) return; if (sess) return; ui.tab = b.dataset.tab; ui.ai = null; render(); window.scrollTo(0, 0); },
  'pick-mode'(b) { if (!need('student', 'child')) return; ui.sheet = { type: 'mode', mode: b.dataset.mode }; renderLayer(); },
  start(b) { if (!need('student', 'child')) return; startSession(b.dataset.mode, b.dataset.group || null); },
  dark() { if (sess && sess.phase === 'focus') { setDark(true); wakeOn(); } },
  'next-block'() { if (sess) nextBlock(); },
  end() {
    if (!sess) { ui.sheet = null; renderLayer(); return; }
    const m = MODES[sess.mode], fromModal = ui.sheet?.type === 'wildcard' || ui.sheet?.type === 'away';
    if (m.guided && sess.phase === 'focus' && sess.pos > 0.05 && !fromModal) { ui.sheet = { type: 'confirm-end' }; renderLayer(); return; }
    ui.sheet = null; finishSession(sess.phase === 'interrupted' && m.guided ? 'exit' : 'manual');
  },
  'end-now'() { ui.sheet = null; finishSession('manual'); },
  resume() { if (sess) { sess.phase = 'focus'; sess.last = Date.now(); setLive({ ...(ST().live || {}), status: 'studying' }); } ui.sheet = null; renderLayer(); },
  'use-wildcard'() { ST().wildcards.used++; save(); if (sess) { sess.phase = 'focus'; sess.last = Date.now(); setLive({ ...(ST().live || {}), status: 'studying' }); } ui.sheet = null; toast('Comodín usado. Bloque salvado.'); renderLayer(); },
  'close-sheet'() {
    const wasSummary = ui.sheet?.type === 'summary'; ui.sheet = null; renderLayer();
    if (wasSummary && need('student') && !ST().user.optional && !ST().optionalAsked) { ST().optionalAsked = true; save(); ui.sheet = { type: 'optional' }; renderLayer(); }
  },
  backdrop(b, e) { if (e.target === b) ACT['close-sheet'](); },
  sheet(b) { ui.sheet = { type: b.dataset.sheet, doc: b.dataset.doc }; renderLayer(); },
  copy(b) { const text = b.dataset.text; try { navigator.clipboard.writeText(text).then(() => toast('Copiado'), () => toast(`Tu código: ${text}`)); } catch { toast(`Tu código: ${text}`); } },

document.addEventListener('submit', async (e) => {

    let msg = '', inviterId = null;
    if (invite) { const hit = Object.entries(S.students).find(([, st]) => st.user?.inviteCode?.toUpperCase() === invite); inviterId = hit ? hit[0] : null; }
    if (!uniId) msg = 'Elige tu universidad (o «Otra o todavía no lo sé»).';

    else if (email && uniId === 'otra') msg = 'Tu universidad aún no está en la lista, así que no podemos verificar ese correo. Déjalo en blanco: podrás estudiar y ganar puntos igualmente.';
    else if (email && !uniDomainOk(uniId, email)) msg = `Ese correo no es de ${UNIS[uniId].name}. Usa el que acaba en ${UNIS[uniId].domains.map((d) => '@' + d).join(' o ')}, o déjalo en blanco por ahora.`;
    else if (email && emailInUse(email) && !(o.idn.p !== 'phone' && o.idn.v === email && !findAccount(o.idn))) msg = 'Ya hay una cuenta con ese correo universitario. Entra con él.';
    else if (alias.length < 3) msg = 'El alias necesita al menos 3 caracteres.';
    else if (!/^[\w.\-áéíóúñ]+$/i.test(alias)) msg = 'El alias solo puede llevar letras, números, puntos, guiones y guiones bajos.';
    else if (Object.values(S.accounts).some((a) => a.alias && a.alias.toLowerCase() === alias.toLowerCase())) msg = 'Ese alias ya está cogido. Prueba con otro.';
    else if (invite && !inviterId) msg = 'Ese código de invitación no existe. Revísalo o déjalo en blanco.';

    if (uniId === 'otra') o.uniId = null;

  }

    let msg = '';

    else if (addr.length < 5) msg = 'Escribe la dirección del local.';
    else if (contact.length < 2) msg = 'Indica una persona de contacto.';
    else if (!validEmail(email)) msg = 'Escribe un correo válido.';
    else if (emailInUse(email)) msg = 'Ya hay una cuenta con ese correo.';

  }

  }

  if (f.dataset.form === 'confirm') {

  }

  const n = kind === 'big' ? 160 : 90;

/* ---------------------------------------------------------------- Comprobación de horarios */
function scheduleCheck() {
  const a = ACC(); const ids = a.type === 'parent' ? myKids() : [a.id];
  const t = now(), d = new Date(t), dow = (d.getDay() + 6) % 7, hm = pad2(d.getHours()) + ':' + pad2(d.getMinutes()), today = new Date(t).toDateString();
  let changed = false;
  for (const id of ids) {
    const st = S.students[id]; if (!st?.schedule) continue;
    st.schedChecked = st.schedChecked || {};
    for (const sl of st.schedule) {
      const key = `${today}|${sl.id}`;
      if (!sl.days.includes(dow) || hm < sl.to || st.schedChecked[key] || (sl.createdAt && sl.createdAt > slotTime(t, sl.from))) continue;
      st.schedChecked[key] = true; changed = true;
      const s0 = slotTime(t, sl.from), s1 = slotTime(t, sl.to);
      const ok = (st.sessionsLog || []).some((e) => e.end > s0 && e.at < s1 && e.focus >= CFG.minSessionFocusMin);
      if (!ok) notifyGuardians(`${st.user.name} no ha estudiado en su horario de hoy (${sl.from}–${sl.to}).`, 'schedule', id);
    }
  }
  if (changed) { save(); render(); }
}
function slotTime(t, hm) { const d = new Date(t); const [h, m] = hm.split(':').map(Number); d.setHours(h, m, 0, 0); return d.getTime(); }
function slotDoneToday(st, sl) {
  const t = now(), s0 = slotTime(t, sl.from), s1 = slotTime(t, sl.to);
  return (st.sessionsLog || []).some((e) => e.end > s0 && e.at < s1 && e.focus >= CFG.minSessionFocusMin);
}

  let base = st.user.name.normalize('NFD').replace(/[^A-Za-z0-9]/g, '').toLowerCase() || 'estudiante', alias = base, n = 1;
  while (Object.values(S.accounts).some((x) => x.alias && x.alias.toLowerCase() === alias)) alias = `${base}${++n}`;
  acc.type = 'student'; acc.alias = alias; acc.uni = {}; acc.formerChild = true; delete acc.guardians;
  st.user.alias = alias; st.user.adult = true; st.adultSince = now(); delete st.kind; delete st.schedule;
  st.user.inviteCode = 'ENVES-' + alias.slice(0, 2).toUpperCase() + String(Math.floor(Math.random() * 90 + 10));

function joinFamily(parentId, inv) {

/* ---------------------------------------------------------------- Sesiones en grupo */
function groupStarted(gid) {
  const g = (S.groups || []).find((x) => x.id === gid); if (!g) return;
  const me = SESSION.accountId, m = g.members.find((x) => x.id === me); if (m) m.status = 'joined';
  // Amigos de ejemplo (sin persona detrás): se unen solos para que la demo se vea completa
  for (const x of g.members) { const acc = S.accounts[x.id]; if (acc?.fake && x.status === 'invited') { x.status = 'joined'; S.students[x.id].live = { status: 'studying', mode: g.mode, since: now(), at: now(), until: now() + 2 * H, groupId: gid }; } }
  save();
}
function groupStripHtml(gid) {
  const g = (S.groups || []).find((x) => x.id === gid); if (!g) return '';
  const me = SESSION.accountId;
  const chips = g.members.filter((x) => x.id !== me).map((x) => {
    const l = S.students[x.id]?.live, name = esc(aliasOf(x.id));
    if (x.status === 'declined') return `<span>${name} · no viene</span>`;
    if (l?.groupId === gid && l.status === 'studying') return `<span class="ok">${name}</span>`;
    if (l?.groupId === gid && l.status === 'paused') return `<span>${name} · en pausa</span>`;
    if (l?.groupId === gid && (l.status === 'away' || l.status === 'out')) return `<span class="out">${name} salió de la app</span>`;
    if (l?.groupId === gid && l.status === 'done') return `<span>${name} terminó</span>`;
    return `<span>${name} · invitado</span>`;
  });
  const fakeIn = g.members.find((x) => S.accounts[x.id]?.fake && S.students[x.id]?.live?.groupId === gid && S.students[x.id].live.status === 'studying');
  return chips.join('') + (fakeIn ? `<button class="link" style="color:var(--night-dim);font-size:12px;font-weight:600" data-act="demo-friend-out" data-id="${fakeIn.id}">Demo: que ${esc(aliasOf(fakeIn.id))} salga de la app</button>` : '');

/* Foto: se reduce en el móvil antes de guardarla (máx. 900 px) */
document.addEventListener('change', (e) => {
  if (e.target.id !== 'cp-photo') return;
  const file = e.target.files?.[0]; if (!file) return;
  const img = new Image(), url = URL.createObjectURL(file);
  img.onload = () => {
    const k = Math.min(1, 900 / Math.max(img.width, img.height)), c = document.createElement('canvas');
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const data = c.toDataURL('image/jpeg', 0.72); URL.revokeObjectURL(url);
    if (ui.sheet?.type === 'compose') ui.sheet.img = data;
    const pv = $('#cp-prev'); if (pv) { pv.innerHTML = `<img src="${data}" alt="Vista previa" style="width:100%;border-radius:18px">`; pv.hidden = false; }
    const w = $('#cp-warn'); if (w) w.hidden = false;
  };
  img.onerror = () => toast('No se ha podido leer esa imagen.');
  img.src = url;
});

let AIS = null, aiState = 'loading', aiCtl = null;
async function aiInit() {

function aiData() {
  const st = ST(); st.ai = st.ai || { premium: false, usage: {}, chat: [], exams: [] };
  const u = st.ai.usage, d = dayKey(now()), w = weekKey(now());
  if (u.day !== d) Object.assign(u, { day: d, explain: 0, notes: 0, total: 0 });
  if (u.week !== w) Object.assign(u, { week: w, exams: 0 });

}
function aiBlock(kind) {
  const ai = aiData(), F = CFG.ai.free;
  if (ai.premium) return ai.usage.total >= CFG.ai.premium.perDay ? 'Has llegado al uso razonable de hoy. Mañana más.' : null;

  if (kind === 'notes' && ai.usage.notes >= F.notes) return `Has usado tu resumen gratis de hoy.`;

}
function aiCount(kind) { const u = aiData().usage; u.total++; if (kind === 'exam') u.exams++; else if (u[kind] !== undefined) u[kind]++; save(); }
function aiErr(e) {
  const c = e?.code;
  if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(c)) { aiState = 'off'; return 'La IA no está disponible en esta vista (no se ha dado permiso o no está activada). El resto de la app funciona igual.'; }

const AI_RULES = `Eres Claude, de Anthropic, configurado por Envés exclusivamente para ayudar a estudiar a universitarios en España. Si te piden algo que no tenga que ver con estudiar o aprender, recondúcelo con amabilidad hacia el estudio. Responde siempre en español de España, claro y cercano, sin relleno.
Reglas: ayuda a entender y a practicar; no redactes trabajos ni resuelvas exámenes que se estén haciendo en ese momento. Si no estás seguro de algo, dilo. Si el estudiante aporta apuntes, básate en ellos y dilo. No des consejos médicos ni psicológicos. Usa Markdown sencillo (títulos con ###, listas con -, **negrita**).`;

/* Markdown mínimo y seguro */
function md(src) {
  const lines = esc(src || '').split('\n'); let out = '', list = null;
  const inline = (t) => t.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>').replace(/(^|[\s(])\*(?!\s)(.+?)\*(?=[\s).,;:!?]|$)/g, '$1<i>$2</i>');
  const close = () => { if (list) { out += `</${list}>`; list = null; } };
  for (const l of lines) {
    const h = l.match(/^#{1,4}\s+(.*)/), ul = l.match(/^\s*[-•*]\s+(.*)/), ol = l.match(/^\s*\d+[.)]\s+(.*)/);
    if (h) { close(); out += `<h4>${inline(h[1])}</h4>`; }
    else if (ul) { if (list !== 'ul') { close(); out += '<ul>'; list = 'ul'; } out += `<li>${inline(ul[1])}</li>`; }
    else if (ol) { if (list !== 'ol') { close(); out += '<ol>'; list = 'ol'; } out += `<li>${inline(ol[1])}</li>`; }
    else if (!l.trim()) close();
    else { close(); out += `<p>${inline(l)}</p>`; }
  }
  close(); return out;
}

async function aiRun(kind, fn) {
  if (aiState !== 'ready' || !AIS) { ui.ai.error = 'La IA no está disponible en esta vista.'; render(); return; }
  const b = aiBlock(kind); if (b) { ui.ai.error = b; render(); return; }
  aiCtl?.abort(); aiCtl = new AbortController();
  ui.ai.busy = true; ui.ai.error = null; render();
  try { await fn(aiCtl.signal); aiCount(kind); }
  catch (e) { const m = aiErr(e); ui.ai.error = m || null; if (e?.text && kind === 'notes') { aiData().lastNotes = { text: e.text, at: now() }; save(); } }
  finally { ui.ai.busy = false; aiCtl = null; render(); }
}
const streamTo = (text) => { const el = $('#ai-stream'); if (el) el.innerHTML = md(text); };

Object.assign(ACT, {
  'ai-open'(b) { if (!need('student')) return; ui.tab = 'ia'; ui.ai = { tool: b.dataset.t, form: {} }; render(); window.scrollTo(0, 0); },
  'ai-close'() { if (ui.ai?.busy) aiCtl?.abort(); ui.ai = null; render(); window.scrollTo(0, 0); },
  'ai-stop'() { aiCtl?.abort(); },
  'ai-clear'() { aiData().chat = []; save(); render(); },
  'ai-premium-on'() { if (!need('student')) return; const ai = aiData(); ai.premium = true; ai.premiumSince = now(); save(); ui.sheet = null; renderLayer(); render(); toast('Premium activado (simulado, sin cobro).'); celebrate('big'); },
  'ai-cancel'() { if (!need('student')) return; aiData().premium = false; save(); render(); toast('Premium cancelado.'); },
  'ai-answer'(b) { const ex = ui.ai?.exam; if (!ex || ex.graded) return; ex.answers[Number(b.dataset.q)] = Number(b.dataset.o); const y = window.scrollY; render(); window.scrollTo(0, y); },
  'ai-grade'() {
    const ex = ui.ai?.exam; if (!ex) return;
    ex.right = ex.questions.filter((q, i) => ex.answers[i] === q.correct).length;
    ex.score = Math.round((ex.right / ex.questions.length) * 100) / 10; ex.graded = true;
    const ai = aiData(); ai.exams = ai.exams || []; ai.exams.push({ topic: ex.topic, score: ex.score, at: now(), n: ex.questions.length }); if (ai.exams.length > 30) ai.exams.shift(); save();
    render(); window.scrollTo(0, 0); if (ex.score >= 5) celebrate(ex.score >= 9 ? 'big' : 'normal');
  },
  'ai-exam-new'() { ui.ai.exam = null; render(); },
  'ai-exam-review'() {
    const ex = ui.ai.exam; const wrong = ex.questions.filter((q, i) => ex.answers[i] !== q.correct);
    const ai = aiData(); ai.chat = ai.chat || [];
    const q = `He hecho un simulacro de «${ex.topic}» y he fallado estas preguntas. Explícame lo que no he entendido, con un ejemplo de cada una:\n` + wrong.map((x, i) => `${i + 1}. ${x.q} (correcta: ${x.options[x.correct]})`).join('\n');
    ui.ai = { tool: 'explain', form: {} }; render();
    setTimeout(() => { const t = $('#ai-q'); if (t) { t.value = q.slice(0, 1500); t.focus(); } }, 30);
  },
  'ai-notes-exam'() { const n = aiData().lastNotes; ui.ai = { tool: 'exam', form: { topic: n?.topic || '', src: n?.text || '' } }; render(); window.scrollTo(0, 0); },
  'ai-plan-edit'() { ui.ai.edit = true; render(); },
});

document.addEventListener('submit', (e) => {
  const f = e.target; if (!need('student')) return;

    const q = $('#ai-q').value.trim(); if (!q) return;
    const ai = aiData(); ai.chat = ai.chat || []; ai.chat.push({ role: 'user', content: q }); save();

      const hist = ai.chat.slice(-10).map((m) => ({ role: m.role, content: m.content }));
      while (hist.length && hist[0].role !== 'user') hist.shift();
      const turns = [{ role: 'user', content: AI_RULES + '\nModo: explicar dudas. Respuestas de 80 a 250 palabras, con un ejemplo cuando ayude. Termina proponiendo una pregunta corta para comprobar si lo ha entendido.' }, { role: 'assistant', content: 'Entendido. ¿Cuál es tu duda?' }, ...hist];
      const r = await AIS(turns, { cache: false, signal, onText: ({ text }) => streamTo(text) });
      ai.chat.push({ role: 'assistant', content: r.text }); if (ai.chat.length > 24) ai.chat.splice(0, ai.chat.length - 24); save();
    }).then(() => { if (ui.ai?.error) { const ai2 = aiData(); if (ai2.chat.at(-1)?.role === 'user') { ai2.chat.pop(); save(); render(); } } setTimeout(() => $('#ai-chat')?.lastElementChild?.scrollIntoView({ block: 'end', behavior: 'smooth' }), 30); });

Cada pregunta tiene exactamente 4 opciones y una sola correcta. Varía la posición de la correcta. Incluye una explicación breve (1-2 frases) de por qué es la correcta.

      const data = await AIS.json(prompt, { signal, modelTier: 'default' });

/* ---------------------------------------------------------------- Pausas */
function msgPausesLeft() { if (!sess) return 0; return 1 + Math.floor((sess.elapsed || 0) / CFG.pause.msgEveryMin) - sess.msgsUsed; }
Object.assign(ACT, {
  pause(b) {
    if (!sess || sess.phase !== 'focus') return;
    const k = b.dataset.k;
    if (k === 'call' && sess.callsUsed >= CFG.pause.callMax) return toast(`Ya has usado las ${CFG.pause.callMax} pausas por llamada de esta sesión.`);
    if (k === 'msg' && msgPausesLeft() <= 0) return toast('La pausa por mensajes es 1 por cada 2 h de sesión.');
    const min = k === 'call' ? CFG.pause.callMin : CFG.pause.msgMin;
    if (k === 'call') sess.callsUsed++; else sess.msgsUsed++;
    sess.pauses++; sess.phase = 'paused'; sess.pause = { kind: k, left: min, total: min }; setDark(false);
    sess.msg = k === 'call' ? `Coge la llamada tranquilo. Tienes ${min} min; la sesión te espera.` : `Contesta lo urgente y vuelve. Tienes ${min} min.`;
    setLive({ ...(ST().live || {}), status: 'paused' });
    if (ACC().type === 'child') notifyGuardians(`${ST().user.name} ha pausado la sesión (${k === 'call' ? 'llamada' : 'mensajes'}, máx. ${min} min).`, 'away');
    renderLayer();
  },
  'pause-end'() { if (!sess || sess.phase !== 'paused') return; sess.phase = 'focus'; sess.last = Date.now(); sess.msg = '¡De vuelta! Móvil boca abajo.'; setLive({ ...(ST().live || {}), status: 'studying' }); renderLayer(); },
});

  st.inviteDone = true; const t = now(), today = dayKey(t), inv = S.students[st.invitedBy];

}

function shrinkImage(file, max, cb) {
  const img = new Image(), url = URL.createObjectURL(file);
  img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); cb(c.toDataURL('image/jpeg', 0.75)); };
  img.onerror = () => toast('No se ha podido leer esa imagen.'); img.src = url;
}
function squareImage(file, size, cb) {
  const img = new Image(), url = URL.createObjectURL(file);
  img.onload = () => { const s0 = Math.min(img.width, img.height), c = document.createElement('canvas'); c.width = c.height = size; c.getContext('2d').drawImage(img, (img.width - s0) / 2, (img.height - s0) / 2, s0, s0, 0, 0, size, size); URL.revokeObjectURL(url); cb(c.toDataURL('image/jpeg', 0.8)); };
  img.onerror = () => toast('No se ha podido leer esa imagen.'); img.src = url;
}

function rewardBlock(st, r, w) {

  if (r.perWeek) { const wk = weekKey(now()); const n = (st.claims || []).filter((c) => c.rewardId === r.id && c.status !== 'rejected' && weekKey(c.at) === wk).length; if (n >= r.perWeek) return `Ya lo has pedido ${r.perWeek === 1 ? 'esta semana' : `${n} veces esta semana`}`; }

function weekStats(st) {

  return { days: new Set(log.map((e) => dayKey(e.end))).size, minutes: log.reduce((a, e) => a + e.focus, 0) };
}
function goalProgress(st, g) { const ws = weekStats(st); const v = g.type === 'days' ? ws.days : ws.minutes; return { v, done: v >= g.target, pct: Math.min(100, Math.round((v / g.target) * 100)) }; }

function goalsCheck(kidId) {
  const st = S.students[kidId]; if (!st?.goals?.length) return false;

  for (const g of st.goals) {

    if (goalProgress(st, g).done) {

}

    ${pend.length ? `<section><h2>Te lo ha pedido</h2>${pend.map((c) => `<article class="redemption new"><h3>${esc(c.title)}</h3><p class="small">${fmt(c.points)} puntos · ${fmtWhen(c.at)}</p>
      <div class="grid2"><button class="btn primary" data-act="approve-claim" data-kid="${kid}" data-id="${c.id}">Aprobar</button><button class="btn" data-act="reject-claim" data-kid="${kid}" data-id="${c.id}">Ahora no</button></div></article>`).join('')}<p class="small muted">Consejo: cumple el premio cuanto antes. Si se retrasa, pierde efecto.</p></section>` : ''}
    ${props.map((x) => `<section class="panel tint-lav"><b>${esc(st.user.name)} propone: «${esc(x.title)}»</b>
      <form class="row" data-form="proposal" data-kid="${kid}" data-id="${x.id}" novalidate><select class="input" style="flex:1;min-width:150px" aria-label="Puntos">${[100, 150, 200, 300, 400, 600, 900, 1200].map((v) => `<option value="${v}" ${v === 300 ? 'selected' : ''}>${v} puntos</option>`).join('')}</select><button class="btn primary small" type="submit">Añadir</button><button class="btn small ghost" type="button" data-act="proposal-no" data-kid="${kid}" data-id="${x.id}">No</button></form></section>`).join('')}
